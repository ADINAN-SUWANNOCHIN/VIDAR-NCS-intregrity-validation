# ============================================================
# DB Secret — TEMPLATE ONLY, do NOT commit with real values
#
# How to apply:
#   1. Copy this file to secret.yaml (it is gitignored)
#   2. Fill in the real values
#   3. kubectl apply -f secret.yaml
# ============================================================
apiVersion: v1
kind: Secret
metadata:
  name: vidar-db-secret
  namespace: default
type: Opaque
stringData:
  DB_HOST: ""         # SQL Server hostname or IP
  DB_PORT: "1433"     # SQL Server port
  DB_USER: ""         # SQL Server login username
  DB_PASSWORD: ""     # SQL Server login password
  DB_NAME: ""         # Default connected database
