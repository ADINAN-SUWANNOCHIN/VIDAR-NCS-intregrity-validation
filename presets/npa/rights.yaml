name: Rights NPA
module: npa
description: "NPA rights tables (la$ prefix). Run all cases or filter by case_name/sources."

cases:
  # ---------------------------------------------------------------
  # Case 1: MULTIPLE 3:1
  # conv$vinpahistory + conv$vinpalrentalhistory + conv$vinpalrtrespasserhist
  #   → la$lahistloantransactionhistory
  # Note: rental and respasserhist are handled internally by the MULTIPLE
  # strategy inside conv$vinpahistory common.yaml. Only the primary table
  # needs to be listed here.
  # ---------------------------------------------------------------
  - name: lahistloantransactionhistory
    rule_path: rights_npa/lahistloantransactionhistory
    tables:
      - "conv$vinpahistory"

  # ---------------------------------------------------------------
  # Case 2: MULTIPLE 5:1
  # conv$vinpahistory + conv$vinpainvcithistoryh + conv$vinpalnsbthistory
  #   + conv$vinpalrentalhistory + conv$vinpalrtrespasserhist
  #   → la$lahisthloantransactionhistoryh
  # All 5 sources are declared inside conv$vinpahistory/common.yaml
  # (table_info.source comma-separated). Only the primary table is listed here.
  # ---------------------------------------------------------------
  - name: lahisthloantransactionhistoryh
    rule_path: rights_npa/lahisthloantransactionhistoryh
    tables:
      - "conv$vinpahistory"

  # ---------------------------------------------------------------
  # Case 3: TRANSACTION cross-check (both NEW tables, no CONV source)
  # la$lahisthloantransactionhistoryh ↔ la$lahistloantransactionhistory
  # Validates shared columns (b4t balances, dates, account info) agree.
  # bill* vs debit/credit formula validation is documented but not yet
  # automated (no formula transform rule in engine).
  # Source listed as the H table's anchor table for engine routing.
  # ---------------------------------------------------------------
  - name: lahistloantransactionhistory_crosscheck
    rule_path: rights_npa/lahistloantransactionhistory_crosscheck
    tables:
      - "la$lahisthloantransactionhistoryh"
