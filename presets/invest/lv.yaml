name: Invest LV
module: invest
description: "LV investment tables (lv$ prefix). conv$vinpllvcithistory is routed to 4 new tables by invaccounttype (TX=6.6M→invtransactionhistoryh, TF=1159→fbo, TS=902→truesale, TF+TS=2061→fbo_truesale). conv$vinpllvhistory → lv$lvhisthsum (partial, P-prefix sysrefs only) + lv$lvhistinvtransactionhistory (all rows, detail)."

cases:
  # ---------------------------------------------------------------
  # Case 1: TRANSACTION ~1:1 (invaccounttype = TX)
  # conv$vinpllvcithistory → lv$lvhisthinvtransactionhistoryh
  # Row count: 6,611,057 (TX rows only; TF/TS rows go to fbo/truesale)
  # Group key: systemreferenceno
  # ---------------------------------------------------------------
  - name: lvhisthinvtransactionhistoryh
    rule_path: invest_lv/lvhisthinvtransactionhistoryh
    tables:
      - "[ncs-conv-aging].dbo.[conv$vinpllvcithistory]"

  # ---------------------------------------------------------------
  # Case 2: TRANSACTION (partial source, P-prefix sysrefs)
  # conv$vinpllvhistory → lv$lvhisthsum
  # lv$lvhisthsum is a UNION of multiple sources. This rule validates
  # only the vinpllvhistory contribution (~24.5% of new table rows).
  # Group key: systemreferenceno (P6xxx / ADC-xxx format).
  # ---------------------------------------------------------------
  - name: lvhisthsum
    rule_path: invest_lv/lvhisthsum
    tables:
      - "[ncs-conv-aging].dbo.[conv$vinpllvhistory]"

  # ---------------------------------------------------------------
  # Case 3: TRANSACTION (invaccounttype = TF — FBO accounts)
  # conv$vinpllvcithistory → lv$lvhisth_fbo
  # Row count: 1,159 (exact 1:1)
  # ---------------------------------------------------------------
  - name: lvhisth_fbo
    rule_path: invest_lv/lvhisth_fbo
    tables:
      - "[ncs-conv-aging].dbo.[conv$vinpllvcithistory]"

  # ---------------------------------------------------------------
  # Case 4: TRANSACTION (invaccounttype = TS — TrueSale accounts)
  # conv$vinpllvcithistory → lv$lvhisth_truesale
  # Row count: 902 (exact 1:1)
  # ---------------------------------------------------------------
  - name: lvhisth_truesale
    rule_path: invest_lv/lvhisth_truesale
    tables:
      - "[ncs-conv-aging].dbo.[conv$vinpllvcithistory]"

  # ---------------------------------------------------------------
  # Case 5: TRANSACTION (invaccounttype IN ('TF','TS') — combined)
  # conv$vinpllvcithistory → lv$lvhisth_fbo_truesale
  # Row count: 2,061 (1,159 TF + 902 TS, exact 1:1)
  # ---------------------------------------------------------------
  - name: lvhisth_fbo_truesale
    rule_path: invest_lv/lvhisth_fbo_truesale
    tables:
      - "[ncs-conv-aging].dbo.[conv$vinpllvcithistory]"

  # ---------------------------------------------------------------
  # Case 6: TRANSACTION — detail transaction history
  # conv$vinpllvhistory → lv$lvhistinvtransactionhistory
  # All vinpllvhistory rows (no source_filter).
  # Group key: systemreferenceno
  # PENDING MANUAL_CHECK: newaccountno→lvaccountno, chargetype→expensecode
  # ---------------------------------------------------------------
  - name: lvhistinvtransactionhistory
    rule_path: invest_lv/lvhistinvtransactionhistory
    tables:
      - "[ncs-conv-aging].dbo.[conv$vinpllvhistory]"

  # ---------------------------------------------------------------
  # Case 7: TRANSACTION (composite group key — batch sysrefs)
  # conv$vinpllvhistory → lv$lvhisthsum
  # CE/RQ/TD/IN/REV/AE/TMB/IR: one sysref covers multiple accounts.
  # Group key: (systemreferenceno, accountno) → (systemreferenceno, lvaccountno)
  # Account mapping: invaccountno → newinvaccountno via conv$vinpllvcithistory
  # Verified: CE 100% pass. TD/IN/REV/AE/TMB/IR: cithistory coverage confirmed.
  # Pending: Z-prefix, BF (sysref explosion between old→new, needs investigation)
  # ---------------------------------------------------------------
  - name: lvhisthsum_cerq
    rule_path: invest_lv/lvhisthsum_cerq
    tables:
      - "[ncs-conv-aging].dbo.[conv$vinpllvhistory]"
