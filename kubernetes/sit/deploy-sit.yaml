apiVersion: apps/v1
kind: Deployment
metadata:
  name: appname
spec:
  replicas: 2
  selector:
    matchLabels:
      app: appname
  template:
    metadata:
      labels:
        app: appname
    spec:
      containers:
        - name: primary
          image: image
          imagePullPolicy: Always
          envFrom: 
            - secretRef:                     
                name: infisical-secret
          env:
            - name: APP_ENV
              value: env
          ports:
            - containerPort: 3000
              name: api
          resources:
            limits:
              memory: "800Mi"
              cpu: "800m"
            requests:
              memory: "500Mi"
              cpu: "500m"
