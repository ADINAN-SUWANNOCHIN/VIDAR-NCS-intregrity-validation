# ============================================================
# Case 2 — Source 1/5: conv$vinpahistory
# Target: la$lahisthloantransactionhistoryh
# Table type: TRANSACTION (group-mode by systemreferencenumber)
#
# NOTE: Groups OVERLAP across the 5 old sources (same sysref can appear
# in vinpa + cit + nsbt simultaneously). Therefore each source is validated
# independently. Columns specific to other sources (CIT: b4txtaxcostbalance,
# nsbt: totaltax etc.) will be 0 in non-owning rows → SUM comparison is safe.
#
# Verified mappings (Sheet 2 of 4COMMON2.xlsx, SQL confirmed):
#   - transactionamount: no clean 1:1 or SUM mapping to any new column — EXCLUDED
#   - ratio → citratio: Q7 SQL showed both = 0 in new — EXCLUDED (AI error in report)
#   - nextpaymentduedateb4t: MISSING in vinpa sample — EXCLUDED for this source
#   - startinterestdate / endinterestdate: MANUAL_CHECK / MISSING in vinpa — EXCLUDED
#   - tellerid: MISSING in vinpa sample (CONV conversion handled by def rules) — EXCLUDED
#   - affectcode / billno / debitcredit / receivetxnid: no mapping in new table — EXCLUDED
# ============================================================

table_info:
  source: "[ncs-conv-aging].dbo.[conv$vinpahistory]"
  target: "[ncs-npl-aging].dbo.[la$lahisthloantransactionhistoryh]"
  table_type: TRANSACTION

anchor_key:
  old: id    # unique auto-increment per row — used for keyset pagination
  new: id

transaction_grouping:
  keys:
    old: systemreferencenumber
    new: systemreferenceno

defaults:
  tolerance: 0.01

schema_mappings:

  exact_matches:
    - old: newaccountno
      new: accountno

    - old: auxilarytransactioncode
      new: auxilarytranscode

    - old: systemreferencenumber
      new: systemreferenceno            # also the group key

    - old: receiptnumber
      new: receiptno

    - old: interestb4t
      new: interestb4t

    - old: currentbalanceb4t
      new: currentbalanceb4t

    - old: costnpaamountb4t
      new: costnpaamountb4t

    - old: unearnedprofitamountb4t
      new: unearnedprofitamountb4t

    - old: fixfloat
      new: fixfloat

    - old: noofdays
      new: noofdays

    - old: tempid
      new: tempid

    - old: remark
      new: remark

    - old: planno
      new: planno

    - old: doctype
      new: doctype

    - old: inputsourcesystem
      new: channel                      # VERIFIED (Data Match)

    - old: ratevariancecode
      new: variancecode

  transformed_matches:
    # Amount columns stored as nvarchar in old, decimal in new
    - old: ratevariance
      new: varianceamount
      transform_rule: NONE

    - old: installment
      new: installmentamount
      transform_rule: NONE

    - old: calculaterate
      new: calculateintrate
      transform_rule: NONE

    - old: interestrate
      new: interestrate
      transform_rule: NONE

    # Date columns: old = ISO string, new = datetime2
    - old: transactiondate
      new: transactiondate
      transform_rule: DATE_TO_DATETIME

    - old: effectivedate
      new: effectivedate
      transform_rule: DATE_TO_DATETIME

    - old: gldate
      new: gldate
      transform_rule: DATE_TO_DATETIME
