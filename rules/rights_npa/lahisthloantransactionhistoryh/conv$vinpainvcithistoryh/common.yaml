# ============================================================
# Case 2 — Source 2/5: conv$vinpainvcithistoryh  (CIT header)
# Target: la$lahisthloantransactionhistoryh
# Table type: TRANSACTION (group-mode by systemreferencenumber)
#
# Key findings (Sheet 3 of 4COMMON2.xlsx, Q6 SQL confirmed):
#   - currentbalanceb4t → b4txtaxcostbalance  (NOT currentbalanceb4t — different column!)
#   - principleamount   → txformatcostnpapaid  (Q6 SQL confirmed exact match)
#   - transactionamount → installmentamount    (AI_VERIFIED)
#   - investoutstandingbalance → currentbalancerunningbalance
#   - nplaccrureinterest → interestrunningbalance
#   - investtaxoutstandingbalance → runningtxtaxcostbalance
#   - otherchargeamountb4t → otherchargeb4t
#   - mischargeamount: Q4 SQL = 0 rows non-zero → ZERO_COLUMN, excluded
#   - interestamount: SPLIT direction unclear — excluded pending further data
#   - ZERO_COLUMN (all 0): adj* columns, gain* amounts, mischargeamountb4t, txformatpppaid
#   - EMPTY_COLUMN: journalseqno, orgjournalseqno, eventcode, glgroupcode, costcenter
# ============================================================

table_info:
  source: "[ncs-conv-aging].dbo.[conv$vinpainvcithistoryh]"
  target: "[ncs-npl-aging].dbo.[la$lahisthloantransactionhistoryh]"
  table_type: TRANSACTION

anchor_key:
  old: id
  new: id

transaction_grouping:
  keys:
    old: systemreferencenumber
    new: systemreferenceno

defaults:
  tolerance: 0.01

schema_mappings:

  exact_matches:
    - old: newaccountno
      new: accountno

    - old: auxilarytransactioncode
      new: auxilarytranscode

    - old: systemreferencenumber
      new: systemreferenceno

    - old: reversalflag
      new: reversal                     # VERIFIED (Data Match)

    - old: inputsourcesystem
      new: channel                      # VERIFIED (Data Match)

    - old: remark
      new: remark

    - old: currency
      new: currency

    - old: otherchargeamountb4t
      new: otherchargeb4t               # AI_VERIFIED

  transformed_matches:
    # CIT-specific amount mappings (SQL confirmed)
    - old: principleamount
      new: txformatcostnpapaid          # Q6: exact match confirmed
      transform_rule: NONE

    - old: transactionamount
      new: installmentamount            # AI_VERIFIED
      transform_rule: NONE

    - old: currentbalanceb4t
      new: b4txtaxcostbalance           # VERIFIED — maps to different new column!
      transform_rule: NONE

    - old: investoutstandingbalance
      new: currentbalancerunningbalance # VERIFIED
      transform_rule: NONE

    - old: nplaccrureinterest
      new: interestrunningbalance       # VERIFIED
      transform_rule: NONE

    - old: investtaxoutstandingbalance
      new: runningtxtaxcostbalance      # VERIFIED
      transform_rule: NONE

    # Date columns
    - old: transactiondate
      new: transactiondate
      transform_rule: DATE_TO_DATETIME

    - old: effectivedate
      new: effectivedate
      transform_rule: DATE_TO_DATETIME

    - old: gldate
      new: gldate
      transform_rule: DATE_TO_DATETIME
