# ============================================================
# Case 2 — Source 4/5: conv$vinpalrentalhistory  (rental)
# Target: la$lahisthloantransactionhistoryh
# Table type: TRANSACTION (group-mode by systemreferencenumber)
#
# Key findings (Sheet 1 of 4COMMON2.xlsx):
#   - EMPTY_COLUMN: loantransaction, debitcredit, affectcode,
#     orgsystemreferencenumber, receivetxnid, tempid — all null in sample
#   - nextpaymentduedateb4t, startinterestdate, endinterestdate: FORMAT CHANGE — included
#   - accountno (old format): MANUAL_CHECK — excluded, newaccountno is correct
# ============================================================

table_info:
  source: "[ncs-conv-aging].dbo.[conv$vinpalrentalhistory]"
  target: "[ncs-npl-aging].dbo.[la$lahisthloantransactionhistoryh]"
  table_type: TRANSACTION

anchor_key:
  old: id
  new: id

transaction_grouping:
  keys:
    old: systemreferencenumber
    new: systemreferenceno

defaults:
  tolerance: 0.01

schema_mappings:

  exact_matches:
    - old: newaccountno
      new: accountno

    - old: auxilarytransactioncode
      new: auxilarytranscode

    - old: systemreferencenumber
      new: systemreferenceno

    - old: receiptnumber
      new: receiptno

    - old: currentbalanceb4t
      new: currentbalanceb4t

    - old: remark
      new: remark

  transformed_matches:
    - old: transactionamount
      new: transactionamount
      transform_rule: NONE              # AI_VERIFIED

    # Date columns — rental has start/end interest dates (verified FORMAT CHANGE)
    - old: transactiondate
      new: transactiondate
      transform_rule: DATE_TO_DATETIME

    - old: effectivedate
      new: effectivedate
      transform_rule: DATE_TO_DATETIME

    - old: nextpaymentduedateb4t
      new: nextpaymentduedateb4t
      transform_rule: DATE_TO_DATETIME

    - old: startinterestdate
      new: startinterestdate
      transform_rule: DATE_TO_DATETIME

    - old: endinterestdate
      new: endinterestdate
      transform_rule: DATE_TO_DATETIME
