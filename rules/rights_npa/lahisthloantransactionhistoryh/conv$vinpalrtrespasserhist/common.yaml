# ============================================================
# Case 2 — Source 5/5: conv$vinpalrtrespasserhist  (respasserhist)
# Target: la$lahisthloantransactionhistoryh
# Table type: TRANSACTION (group-mode by systemreferencenumber)
#
# Key findings (Sheet 5 of 4COMMON2.xlsx):
#   - EMPTY_COLUMN in this source: costnpaamountb4t, unearnedprofitamountb4t,
#     planno, receivetxnid, tempid, gldate, inputsourcesystem,
#     startinterestdate, endinterestdate, installment, noofdays, calculaterate, ratio
#   - transactionamount: SPLIT TO transactionamount/debitprincipleamount/creditprincipleamount
#     Direction unclear — excluded pending investigation
#   - ratevariance: EVICTED (no mapping in new table for respass) — excluded
#   - loantransaction / affectcode / billno: MISSING — excluded
#   - debitcredit: No Need in New system
#   - auxilarytransactioncode: MANUAL_CHECK but consistent with other sources → included
# ============================================================

table_info:
  source: "[ncs-conv-aging].dbo.[conv$vinpalrtrespasserhist]"
  target: "[ncs-npl-aging].dbo.[la$lahisthloantransactionhistoryh]"
  table_type: TRANSACTION

anchor_key:
  old: id
  new: id

transaction_grouping:
  keys:
    old: systemreferencenumber
    new: systemreferenceno

defaults:
  tolerance: 0.01

schema_mappings:

  exact_matches:
    - old: newaccountno
      new: accountno

    - old: auxilarytransactioncode
      new: auxilarytranscode

    - old: systemreferencenumber
      new: systemreferenceno

    - old: receiptnumber
      new: receiptno

    - old: currentbalanceb4t
      new: currentbalanceb4t

    - old: interestb4t
      new: interestb4t

    - old: fixfloat
      new: fixfloat

    - old: remark
      new: remark

    - old: ratevariancecode
      new: variancecode

    - old: tellerid
      new: tellerid                     # AI_VERIFIED

    - old: doctype
      new: doctype

  transformed_matches:
    - old: interestrate
      new: interestrate
      transform_rule: NONE

    # Date columns (start/end interest dates are EMPTY in respass — excluded)
    - old: transactiondate
      new: transactiondate
      transform_rule: DATE_TO_DATETIME

    - old: effectivedate
      new: effectivedate
      transform_rule: DATE_TO_DATETIME

    - old: nextpaymentduedateb4t
      new: nextpaymentduedateb4t
      transform_rule: DATE_TO_DATETIME
