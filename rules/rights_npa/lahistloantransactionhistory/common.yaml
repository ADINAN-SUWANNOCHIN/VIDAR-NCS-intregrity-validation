# ============================================================
# Case 1: MULTIPLE 3:1 (Transaction)
# conv$vinpahistory + conv$vinpalrentalhistory + conv$vinpalrtrespasserhist
#   → la$lahistloantransactionhistory
#
# Row counts (verified from data discovery):
#   conv$vinpahistory:          2,776,891 rows (2,775,965 successlv2=true; 926 excluded by source_filter)
#   conv$vinpalrentalhistory:         147 rows
#   conv$vinpalrtrespasserhist:        11 rows
#   la$lahistloantransactionhistory: (sum of all 3)
#
# Key findings from sample data:
#   - Group keys (systemreferencenumber) are MUTUALLY EXCLUSIVE across the 3 sources
#     → each group key appears in exactly one old table. Per-pair comparison is safe.
#   - old.newaccountno → new.accountno  (old.accountno is old-format "PSA..." NOT used in new)
#   - old.loantransaction → new.loantranshostcode  (subset_matches — NCS adds extra rows with new codes)
#   - old.loantransaction → new.loantransactionhistorycode  (DEFECT: new column always NULL — migration missed this)
#   - old.auxilarytransactioncode → new.auxilarytranscode
#   - old.systemreferencenumber → new.systemreferenceno  (group key, also maps as data)
#   - old.receiptnumber → new.receiptno
#   - old.ratevariance → new.varianceamount
#   - old.installment → new.installmentamount
#   - old.calculaterate → new.calculateintrate
#   - old.ratevariancecode → new.variancecode
#   - billno: excluded — old format "200811" vs new "20081121150000434" (concat of billno+accountno)
#   - inputsourcesystem: only in vinpahistory + vinpalrtrespasserhist, NOT in vinpalrentalhistory
#   - costnpaamountb4t, interestb4t, unearnedprofitamountb4t: NOT in vinpalrentalhistory
#   - startinterestdate, endinterestdate: empty nvarchar vs null datetime2 — excluded
#   - noofdays: old=nvarchar (often empty) vs new=null int — excluded for now
#   - interestrate: old="" empty vs new=0 decimal — excluded for now
#
# Vali rules:
#   - vali001: Teller ID conversion check (FIELD_VALUE_CHECK) — global vali
# Def rules:
#   - def01:  PP+QQ group cohesion check (ROW_LEVEL_COHESION)
# ============================================================

table_info:
  # Comma-separated: 3 old tables mapping to 1 new table
  source: "[ncs-conv-aging].dbo.[conv$vinpahistory],[ncs-conv-aging].dbo.[conv$vinpalrentalhistory],[ncs-conv-aging].dbo.[conv$vinpalrtrespasserhist]"
  target: "[ncs-npl-aging].dbo.[la$lahistloantransactionhistory]"
  table_type: MULTIPLE
  # Exclude rows that failed lv2 migration (successlv2=false).
  # vinpahistory: 926 rows with successlv2=false are not in new table — filtering prevents false VALUE_MISMATCH.
  # rental + respasserhist: all rows have successlv2=true → filter is a no-op for them.
  source_filter: "successlv2 = 1"

# anchor_key: used ONLY for keyset pagination ordering within each source table.
# In group-mode (transaction_grouping defined), new rows are fetched by group key — NOT by anchorKeyNew.
# id is auto-increment and unique per row in every source table → safe for keyset streaming.
anchor_key:
  old: id
  new: id   # not used for fetching in group-mode; placeholder required by schema

# Group-mode: carry-over streaming by systemreferencenumber.
# Old rows are paginated by anchor_key.old (id), grouped by tg.keys.old.
# New rows are fetched WHERE tg.keys.new = groupKey (no anchor-key join needed).
transaction_grouping:
  keys:
    old: systemreferencenumber
    new: systemreferenceno
  target_fetch_key: journalseqno  # indexed; verified equal to systemreferenceno on all rows
  use_sysref_sort: true         # CONFIRMED SCATTERED: conv$vinpahistory 99.8% groups scattered (ratio 176M×)
                                  # carry-over streaming produces false VALUE_MISMATCH for partial groups
  row_fingerprint:
    - old: affectcode
      new: affectcode
    - old: debitcredit
      new: debitcredit
    - old: transactionamount
      new: transactionamount
    - old: transactiondate
      new: transactiondate
      transform: YEAR_ONLY

defaults:
  tolerance: 0.01   # allow 0.01 rounding difference on decimal amounts

schema_mappings:

  # ---- Column name mappings (direct value comparison, no transform) ----
  # Mappings WITHOUT src_table → default to first source (conv$vinpahistory).
  # All 3 sources share these column names and semantics.
  #
  # Note: non-numeric string columns (debitcredit, affectcode, etc.) are included for
  # documentation and row-mode compatibility. In group-mode, only numeric columns
  # (those where sumColumn returns a number) generate VALUE_MISMATCH errors.
  exact_matches:
    # Account number: old stores new-system number in newaccountno, NOT accountno
    - old: newaccountno
      new: accountno

    - old: auxilarytransactioncode
      new: auxilarytranscode          # column renamed (shortened)

    - old: debitcredit
      new: debitcredit

    - old: tellerid
      new: tellerid                   # further validated by def001 (FIELD_VALUE_CHECK)

    - old: systemreferencenumber
      new: systemreferenceno          # column renamed; also the group key

    - old: receiptnumber
      new: receiptno                  # column renamed

    - old: currentbalanceb4t
      new: currentbalanceb4t

    - old: planno
      new: planno

    - old: doctype
      new: doctype

    - old: remark
      new: remark

    - old: fixfloat
      new: fixfloat

    - old: receivetxnid
      new: receivetxnid

    - old: tempid
      new: tempid

    - old: ratevariancecode
      new: variancecode               # column renamed

    # loantransaction → loantransactionhistorycode: migration DEFECT — new column is always NULL.
    # old.loantransaction has data but was never written to loantransactionhistorycode during migration.
    # (old.loantransaction → new.loantranshostcode is a separate, correct mapping in subset_matches)
    - old: loantransaction
      new: loantransactionhistorycode

    # NOTE: billno excluded from exact_matches — handled via concat_matches below
    # NOTE: planno not in conv$vinpalrentalhistory — safe (only checked in vinpahistory pair)

    # ---- conv$vinpalrentalhistory full column mappings ----
    # 147 rows total, 147 match new table (1:1 confirmed, 0 unmatched).
    # All columns verified via data comparison 2026-03-27.
    # NOTE: accountno (old) is old-format "RN6701-00001-R01" — NOT used; newaccountno is correct.
    # NOTE: startinterestdate/endinterestdate have real data in rental (86/147 rows filled)
    #       → mapped via transformed_matches for rental pair (unlike vinpahistory where both = empty).
    - old: newaccountno
      new: accountno
      src_table: "[ncs-conv-aging].dbo.[conv$vinpalrentalhistory]"
      tgt_table: "[ncs-npl-aging].dbo.[la$lahistloantransactionhistory]"

    - old: tellerid
      new: tellerid
      src_table: "[ncs-conv-aging].dbo.[conv$vinpalrentalhistory]"
      tgt_table: "[ncs-npl-aging].dbo.[la$lahistloantransactionhistory]"

    - old: remark
      new: remark
      src_table: "[ncs-conv-aging].dbo.[conv$vinpalrentalhistory]"
      tgt_table: "[ncs-npl-aging].dbo.[la$lahistloantransactionhistory]"

    - old: auxilarytransactioncode
      new: auxilarytranscode
      src_table: "[ncs-conv-aging].dbo.[conv$vinpalrentalhistory]"
      tgt_table: "[ncs-npl-aging].dbo.[la$lahistloantransactionhistory]"

    - old: receiptnumber
      new: receiptno
      src_table: "[ncs-conv-aging].dbo.[conv$vinpalrentalhistory]"
      tgt_table: "[ncs-npl-aging].dbo.[la$lahistloantransactionhistory]"

    # ---- conv$vinpalrtrespasserhist full column mappings ----
    # 11 rows total (5 sysref groups + 1 empty-sysref BF row).
    # All columns verified via data comparison 2026-03-27.
    # NOTE: accountno (old) is old-format — NOT used; newaccountno is correct.
    # NOTE: affectcode — PP/C×5, QQ/C×5, PP/D×1 in old; PP+QQ per group in new.
    #       old ⊆ new confirmed → added as exact_match (string, group-mode doc only).
    # NOTE: interestrate — all '0' or '' (no real data) → excluded.
    # NOTE: billno — same concat pattern as vinpahistory (billno+newaccountno) → handled by
    #       default concat_match which applies to vinpahistory pair; documented here only.
    - old: newaccountno
      new: accountno
      src_table: "[ncs-conv-aging].dbo.[conv$vinpalrtrespasserhist]"
      tgt_table: "[ncs-npl-aging].dbo.[la$lahistloantransactionhistory]"

    - old: debitcredit
      new: debitcredit
      src_table: "[ncs-conv-aging].dbo.[conv$vinpalrtrespasserhist]"
      tgt_table: "[ncs-npl-aging].dbo.[la$lahistloantransactionhistory]"

    - old: affectcode
      new: affectcode
      src_table: "[ncs-conv-aging].dbo.[conv$vinpalrtrespasserhist]"
      tgt_table: "[ncs-npl-aging].dbo.[la$lahistloantransactionhistory]"

    - old: loantransaction
      new: loantranshostcode
      src_table: "[ncs-conv-aging].dbo.[conv$vinpalrtrespasserhist]"
      tgt_table: "[ncs-npl-aging].dbo.[la$lahistloantransactionhistory]"

    - old: tellerid
      new: tellerid
      src_table: "[ncs-conv-aging].dbo.[conv$vinpalrtrespasserhist]"
      tgt_table: "[ncs-npl-aging].dbo.[la$lahistloantransactionhistory]"

    - old: doctype
      new: doctype
      src_table: "[ncs-conv-aging].dbo.[conv$vinpalrtrespasserhist]"
      tgt_table: "[ncs-npl-aging].dbo.[la$lahistloantransactionhistory]"

    - old: remark
      new: remark
      src_table: "[ncs-conv-aging].dbo.[conv$vinpalrtrespasserhist]"
      tgt_table: "[ncs-npl-aging].dbo.[la$lahistloantransactionhistory]"

    - old: fixfloat
      new: fixfloat
      src_table: "[ncs-conv-aging].dbo.[conv$vinpalrtrespasserhist]"
      tgt_table: "[ncs-npl-aging].dbo.[la$lahistloantransactionhistory]"

    - old: ratevariancecode
      new: variancecode
      src_table: "[ncs-conv-aging].dbo.[conv$vinpalrtrespasserhist]"
      tgt_table: "[ncs-npl-aging].dbo.[la$lahistloantransactionhistory]"

    - old: auxilarytransactioncode
      new: auxilarytranscode
      src_table: "[ncs-conv-aging].dbo.[conv$vinpalrtrespasserhist]"
      tgt_table: "[ncs-npl-aging].dbo.[la$lahistloantransactionhistory]"

    - old: receiptnumber
      new: receiptno
      src_table: "[ncs-conv-aging].dbo.[conv$vinpalrtrespasserhist]"
      tgt_table: "[ncs-npl-aging].dbo.[la$lahistloantransactionhistory]"

  subset_matches:
    # affectcode: all CONV affectcodes must appear in NCS, but NCS adds extra rows
    # (QQ total rows + I1/C credit counterparts). Old ⊆ new is the correct check.
    - old: affectcode
      new: affectcode
    # loantranshostcode: same reason — NCS adds auto rows with new host codes.
    - old: loantransaction
      new: loantranshostcode

  # ---- Amount columns: old = nvarchar string ("5179.46"), new = decimal ----
  # isEqual() uses parseFloat on both sides → tolerance 0.01 handles rounding.
  # Repeated for each source so all 3 sources get amount validation.
  transformed_matches:
    # transactionamount: present in rental and respasserhist (vinpahistory handled via filtered_sum_matches)
    - old: transactionamount
      new: transactionamount
      transform_rule: NONE
      src_table: "[ncs-conv-aging].dbo.[conv$vinpalrentalhistory]"
      tgt_table: "[ncs-npl-aging].dbo.[la$lahistloantransactionhistory]"

    - old: transactionamount
      new: transactionamount
      transform_rule: NONE
      src_table: "[ncs-conv-aging].dbo.[conv$vinpalrtrespasserhist]"
      tgt_table: "[ncs-npl-aging].dbo.[la$lahistloantransactionhistory]"

    # currentbalanceb4t: present in all 3 sources
    - old: currentbalanceb4t
      new: currentbalanceb4t
      transform_rule: NONE
      src_table: "[ncs-conv-aging].dbo.[conv$vinpalrentalhistory]"
      tgt_table: "[ncs-npl-aging].dbo.[la$lahistloantransactionhistory]"

    - old: currentbalanceb4t
      new: currentbalanceb4t
      transform_rule: NONE
      src_table: "[ncs-conv-aging].dbo.[conv$vinpalrtrespasserhist]"
      tgt_table: "[ncs-npl-aging].dbo.[la$lahistloantransactionhistory]"
    # (vinpahistory currentbalanceb4t handled via exact_matches above — falls back to vinpahistory pair)

    # costnpaamountb4t: in vinpahistory + vinpalrtrespasserhist only (NOT in vinpalrentalhistory)
    - old: costnpaamountb4t
      new: costnpaamountb4t
      transform_rule: NONE
      src_table: "[ncs-conv-aging].dbo.[conv$vinpalrtrespasserhist]"
      tgt_table: "[ncs-npl-aging].dbo.[la$lahistloantransactionhistory]"

    - old: costnpaamountb4t
      new: costnpaamountb4t
      transform_rule: NONE

    - old: interestb4t
      new: interestb4t
      transform_rule: NONE

    - old: unearnedprofitamountb4t
      new: unearnedprofitamountb4t
      transform_rule: NONE

    # interestb4t + unearnedprofitamountb4t for vinpalrtrespasserhist
    - old: interestb4t
      new: interestb4t
      transform_rule: NONE
      src_table: "[ncs-conv-aging].dbo.[conv$vinpalrtrespasserhist]"
      tgt_table: "[ncs-npl-aging].dbo.[la$lahistloantransactionhistory]"

    - old: unearnedprofitamountb4t
      new: unearnedprofitamountb4t
      transform_rule: NONE
      src_table: "[ncs-conv-aging].dbo.[conv$vinpalrtrespasserhist]"
      tgt_table: "[ncs-npl-aging].dbo.[la$lahistloantransactionhistory]"

    # Renamed amount/numeric columns (vinpahistory only — not present in rental; respasserhist has them)
    - old: ratevariance
      new: varianceamount             # column renamed
      transform_rule: NONE

    - old: installment
      new: installmentamount          # column renamed
      transform_rule: NONE

    # calculaterate (vinpahistory): moved to filtered_sum_matches — per-affectcode comparison
    # (default entry removed to avoid inflated group sum comparison against NCS auto-rows)

    # ratevariance/installment/calculaterate for vinpalrtrespasserhist
    - old: ratevariance
      new: varianceamount
      transform_rule: NONE
      src_table: "[ncs-conv-aging].dbo.[conv$vinpalrtrespasserhist]"
      tgt_table: "[ncs-npl-aging].dbo.[la$lahistloantransactionhistory]"

    - old: installment
      new: installmentamount
      transform_rule: NONE
      src_table: "[ncs-conv-aging].dbo.[conv$vinpalrtrespasserhist]"
      tgt_table: "[ncs-npl-aging].dbo.[la$lahistloantransactionhistory]"

    - old: calculaterate
      new: calculateintrate
      transform_rule: NONE
      src_table: "[ncs-conv-aging].dbo.[conv$vinpalrtrespasserhist]"
      tgt_table: "[ncs-npl-aging].dbo.[la$lahistloantransactionhistory]"

    # Date columns: old = nvarchar date string, new = datetime2
    # DATE_TO_DATETIME normalizes both to YYYY-MM-DD for comparison
    - old: transactiondate
      new: transactiondate
      transform_rule: DATE_TO_DATETIME

    - old: effectivedate
      new: effectivedate
      transform_rule: DATE_TO_DATETIME

    - old: gldate
      new: gldate
      transform_rule: DATE_TO_DATETIME

    # nextpaymentduedateb4t: old=nvarchar "YYYY-MM-DD", new=datetime2
    # DATE_TO_DATETIME documents the correct transform. Note: in group-mode sumColumn() skips
    # date strings (NaN → null) so this is not actively compared — use concat_matches if needed.
    - old: nextpaymentduedateb4t
      new: nextpaymentduedateb4t
      transform_rule: DATE_TO_DATETIME

    # NOTE: startinterestdate, endinterestdate — excluded for vinpahistory (old="" nvarchar vs new=null datetime2).
    #   conv$vinpalrentalhistory (86/147 rows have real dates) → mapped below for rental pair.
    # NOTE: noofdays — excluded: old="" nvarchar vs new=null int (empty-vs-null edge case)
    # NOTE: interestrate — excluded for vinpahistory (old="" empty vs new=0 decimal).
    #   conv$vinpalrtrespasserhist interestrate = all '0' or '' → no real data, excluded.

    # ---- Date columns for rental pair ----
    - old: nextpaymentduedateb4t
      new: nextpaymentduedateb4t
      transform_rule: DATE_TO_DATETIME
      src_table: "[ncs-conv-aging].dbo.[conv$vinpalrentalhistory]"
      tgt_table: "[ncs-npl-aging].dbo.[la$lahistloantransactionhistory]"

    - old: startinterestdate
      new: startinterestdate
      transform_rule: DATE_TO_DATETIME
      src_table: "[ncs-conv-aging].dbo.[conv$vinpalrentalhistory]"
      tgt_table: "[ncs-npl-aging].dbo.[la$lahistloantransactionhistory]"

    - old: endinterestdate
      new: endinterestdate
      transform_rule: DATE_TO_DATETIME
      src_table: "[ncs-conv-aging].dbo.[conv$vinpalrentalhistory]"
      tgt_table: "[ncs-npl-aging].dbo.[la$lahistloantransactionhistory]"

  # Per-affectcode amount validation for conv$vinpahistory.
  # Replaces the old GROUP SUM check which was inflated by NCS auto-rows (QQ/I1-C).
  # Each filter compares SUM(old[ac,dc]) to SUM(new[ac,dc]) — NCS rows with different
  # affectcodes are excluded from both sides, so the comparison is meaningful.
  filtered_sum_matches:
    - old: transactionamount
      old_filter: {affectcode_in: ['PP'], debitcredit: 'C'}
      new_filter: {affectcode_in: ['PP'], debitcredit: 'C'}
      new: transactionamount
      skip_if_old_empty: true

    - old: transactionamount
      old_filter: {affectcode_in: ['I1', 'I2', 'I3', 'IN', 'IT', 'GG'], debitcredit: 'D'}
      new_filter: {affectcode_in: ['I1', 'I2', 'I3', 'IN', 'IT', 'GG'], debitcredit: 'D'}
      new: transactionamount
      skip_if_old_empty: true

    - old: transactionamount
      old_filter: {affectcode_in: ['QQ'], debitcredit: 'C'}
      new_filter: {affectcode_in: ['QQ'], debitcredit: 'C'}
      new: transactionamount
      skip_if_old_empty: true

    # calculaterate: interest rate stored per-row. Compare only I1/D rows (where rate is set).
    # QQ rows have calculaterate=0 in old but NCS populates calculateintrate on expanded rows.
    # skip_if_old_empty: QQ-only groups have no I1/D → NCS expanded them, skip rate check.
    - old: calculaterate
      old_filter: {affectcode_in: ['I1', 'I2', 'I3', 'IN', 'IT', 'GG'], debitcredit: 'D'}
      new_filter: {affectcode_in: ['I1', 'I2', 'I3', 'IN', 'IT', 'GG'], debitcredit: 'D'}
      new: calculateintrate
      skip_if_old_empty: true

  # ---- Concat mappings ----
  # billno: old="200811" → new="20081121150000434" (billno + newaccountno concatenated, no separator)
  # Engine in group-mode: collects distinct (billno+newaccountno) per old row, compares to distinct new.billno values.
  concat_matches:
    - old_cols: [billno, newaccountno]
      new: billno
      separator: ""

    # orgsystemreferencenumber: present when sysref has R-prefix (reversal transactions).
    # Pattern: old sysref = "RITEM6408003300", orgsysref = "ITEM6408003300" (original without R).
    # Confirmed: new.originaljournalseqno = same value. 1,896 groups affected (~0.3%).
    # nvarchar on both sides → concat_matches string comparison is safe.
    - old_cols: [orgsystemreferencenumber]
      new: originaljournalseqno
