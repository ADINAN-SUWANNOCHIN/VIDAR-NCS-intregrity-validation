# ============================================================
# DEF-001: Teller ID conversion check
# (Table-specific override of global/defs/def001.yaml)
#
# Business rule:
#   The ETL should look up each teller code from the old system
#   and replace it with the corresponding AD username in la$lahistloantransactionhistory.tellerid.
#
#   Successful conversion → tellerid = AD username (e.g. "surasak.s")
#
#   Failed conversion — 4 patterns to flag:
#     1. ^\d+$   — still a pure numeric code (e.g. "1221") → not converted at all
#     2. ^CONV$  — plain "CONV" → ETL used fallback conversion marker
#     3. ^\*     — asterisk-prefixed (e.g. "*CONV", "*1221") → explicit ETL failure marker
#     4. ^PLAN   — plan-style value (e.g. "PLAN", "PLAN01") → wrong mapping fallback
#
#   NOTE: regex is compiled case-insensitive — catches "conv", "CONV", "plan", "PLAN", etc.
#
# What is allowed (skip_if_old_equals):
#   - old.tellerid = "CONV" → this was already a conversion record in the old system;
#     one corresponding "CONV" in new is permitted per such old row.
#
# Error output format (produced by engine automatically):
#   "... — old tellerid: [1221] → new tellerid: [1221]"
#   "... — old tellerid: [1221] → new tellerid: [CONV]"
#   Group key (systemreferencenumber) is also recorded in the Detail_Log CSV.
# ============================================================

def_id: def001
target_scope: transaction_group

actions:
  - step: "1"
    check_type: FIELD_VALUE_CHECK
    variables:
      new_col: tellerid
      old_col: tellerid
      skip_if_old_equals: CONV
      fail_if_new_matches: "^\\d+$|^\\*|^CONV$|^PLAN"
    condition: valid
    error_message: "Teller ID not converted in la$lahistloantransactionhistory — expected AD username (e.g. surasak.s)"
