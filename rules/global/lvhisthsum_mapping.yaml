  - column: txdebitgaintaxbalance
    total_across_table: 488835716.06
    note: "Populated. Formula unconfirmed."
  - column: txcreditotherexpense
    total_across_table: 5206028288.66
    note: "Populated. Formula unconfirmed."
  - column: txdebitotherexpense
    total_across_table: 7517912129.15
    note: "Populated. Formula unconfirmed."
  - column: txcreditintascitratio
    total_across_table: 120837256691.17
    note: "Populated. 'intascit' = interest accrual SBT ratio. Possible source: SB (SBT on Accrue Interest). Formula unconfirmed."
  - column: txdebitintascitratio
    total_across_table: 2363433471.10
    note: "Populated. Formula unconfirmed."

# ----------------------------------------------------------------
# SPECIAL: transactionamount in lv$lvhisthsum new row
#
# The new.transactionamount value comes from the OLD row with:
#   loantranshostcode = '90000'  (QQ - Payment Auto Split, consolidate=N)
# This is the total payment amount for the transaction group.
# It is NOT summed from consolidate=C rows.
# ----------------------------------------------------------------
transactionamount_source:
  source_loantranshostcode: "90000"
  affectcode: QQ
  description: "Payment Auto Split — total payment for the group"
  note: "consolidate=N so it does not contribute to any lv* column; it sets new.transactionamount directly"

# ----------------------------------------------------------------
# VALIDATION STRATEGY
#
# Per sysref group, validate each lv* column as:
#   SUM(old.transactionamount
#       WHERE loantranshostcode NOT IN <exclude_list>   ← loantranshostcode_not_in
#         AND affectcode IN <affectcodes_for_column>
#         AND debitcredit = <C or D>)
#   = new.<lv_column>
#
# For yield/irr columns use loantranshostcode_in instead:
#   SUM(old.transactionamount
#       WHERE loantranshostcode IN <redirect_list>      ← loantranshostcode_in
#         AND affectcode IN [I2] or [I3]
#         AND debitcredit = <C or D>)
#   = new.<lv_column>
#
# Engine status (2026-03-17):
#   loantranshostcode_not_in — SUPPORTED (filtered_sum_matches)
#   loantranshostcode_in     — SUPPORTED (filtered_sum_matches, rule.types.ts:94-95)
#   Both are live in lvhisthsum/common.yaml and lvhisthsum_cerq/common.yaml
# ----------------------------------------------------------------
