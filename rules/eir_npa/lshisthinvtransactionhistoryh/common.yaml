# ============================================================
# Case 2: TRANSACTION N:1 (conv → H aggregate)
# conv$vinpainvesthist → ls$lshisthinvtransactionhistoryh
#
# Row cardinality:
#   CONV groups (doctype=BF, tellerid=CONV): N old rows → 1 H row per group.
#     Each old row's transactionamount maps to ONE lv* debit/credit column
#     in H based on loantransaction code + debitcredit direction.
#   LIVE groups (ITEM/non-CONV): present in H but NOT in conv.
#     These will produce ROW_MISSING "found in target but not in source" — EXPECTED.
#
# Validation strategy:
#   split_matches: SUM(conv.transactionamount per group) = SUM(all lv* columns in H row).
#     Verifies total amount is preserved across the pivot/split into lv* columns.
#   exact_matches: identity + direct pass-through fields.
#   Format columns (lsformat*/laformat*): direct pass-through from conv.
#     Group-level SUM is safe because typically only one row per conv group
#     carries the format value (others are null/empty → sumColumn returns null → skipped).
#
# ANCHOR KEY NOTE: same as Case 1 — group key used as anchor (IDs not preserved).
#   With TransactionStrategy now fetching by tg.keys.new, this is safe for the 1:1 case
#   (sysref unique per row). For the N:1 case here, sysref repeats per group — pagination
#   risk if chunk boundary falls mid-group, but negligible at chunkSize=5000 vs group_size≤5.
#
# Expected ROW_MISSING in report:
#   ~83 groups (ITEM/live transactions) found in H but not in conv — normal.
#   If CONV groups (PSA prefix) are missing → real migration issue.
# ============================================================

table_info:
  source: "[ncs-conv-aging].dbo.[conv$vinpainvesthist]"
  target: "[ncs-npl-aging].dbo.[ls$lshisthinvtransactionhistoryh]"
  table_type: TRANSACTION

anchor_key:
  old: systemreferencenumber
  new: systemreferenceno

transaction_grouping:
  keys:
    old: systemreferencenumber
    new: systemreferenceno
  target_fetch_key: journalseqno  # indexed; verified equal to systemreferenceno on all rows
  use_sysref_sort: true         # rows are SCATTERED (same source as lshistinvtransactionhistory)

defaults:
  tolerance: 0.01

schema_mappings:

  exact_matches:
    - old: newaccountno
      new: lsaccountno

    - old: systemreferencenumber
      new: systemreferenceno

    - old: systemreferencenumber
      new: orderno

    # NOTE: affectcode EXCLUDED from exact_matches — the N:M H-table structure means old has
    # multiple rows with {PP, I1, QQ} but H rows carry different affectcodes per ledger entry.
    # Distinct-set comparison produces false VALUE_MISMATCH on every group.
    # Affectcode routing correctness is fully validated by def001 steps 1-5 (amount per affectcode
    # lands in the correct lv* column). No separate affectcode column check needed.

    - old: chargetype
      new: chargetype

    # NOTE: tellerid EXCLUDED — H-table rows carry a different tellerid format than old conv rows
    # (numeric code in old vs AD username in new). N:M distinct-set always mismatches per group.

    - old: servicebranch
      new: servicebranch

    - old: currentbalanceb4t
      new: currentbalanceb4t

    - old: interestb4t
      new: interestb4t

    - old: orgsystemreferencenumber
      new: orgsystemreferencenumber

    - old: doctype
      new: doctype

    - old: inputsourcesystem
      new: inputsourcesystem

    - old: remark
      new: remark

    - old: noofdays
      new: noofdays

    # NOTE: Format columns (lsformat*, laformat*) EXCLUDED from exact_matches.
    # In the N:M H-table structure each old CONV row fans out to multiple H rows; only one H row
    # per group carries each format value while the others are null. Distinct-set comparison on
    # the new side picks up null → empty → skipped, but old side has the real value → mismatch.
    # These columns are validated by def002 (format integrity check). No separate check needed.
    # Excluded: lsformatdiffincome, lsformatbfaccint, lsformattdrdiffincome, lsformatmodifygainloss,
    #           laformatbfaccint, laformatbfggpayment, laformatcreditpp, laformatggpayment,
    #           laformatsumintpayment.
    # NOTE: laformatt9adjustpp is in old but NOT found in H columns — excluded

  transformed_matches:
    # NOTE: eirrate, calculateintrate, calprovisionamount are EXCLUDED from transformed_matches.
    # These are constant-per-group values (account-level rate/provision, same for all rows
    # in a sysref group). sumColumn gives N×value vs M×value when old and H row counts differ
    # (e.g. 4 old rows × 0.04 = 0.16 ≠ 3 H rows × 0.04 = 0.12 → false VALUE_MISMATCH).
    # Validated via COUNT-normalized AVG comparison in def001 steps 7-9.

    - old: transactiondate
      new: transactiondate
      transform_rule: DATE_TO_DATETIME

    - old: effectivedate
      new: effectivedate
      transform_rule: DATE_TO_DATETIME

    - old: gldate
      new: gldate
      transform_rule: DATE_TO_DATETIME

    - old: startinterestdate
      new: startinterestdate
      transform_rule: DATE_TO_DATETIME

    - old: endinterestdate
      new: endinterestdate
      transform_rule: DATE_TO_DATETIME

  # --- amount split validation ---
  # SUM(old transactionamount per group) = SUM of all receiving columns in H per group.
  # Routing confirmed by Q4 SUM cross-check across whole table:
  #   PP/C → lvcreditprincipleamount
  #   PP/D → lvdebitprincipleamount
  #   QQ/C + QQ/D → transactionamount  (debit/credit distinction lost; both combined into one column)
  #   I1/C → lvcreditinterestamount
  #   I1/D → lvdebitinterestamount
  # NOTE: zero-amount sysrefs (PSA/ADJ/ADJM prefix, ~17k) are absent from H-table by design;
  #   they migrated to ls$lshistinvtransactionhistory instead. SUM validation is unaffected.
  split_matches:
    - old: transactionamount
      new_cols:
        - transactionamount          # QQ rows route here (debit+credit combined)
        - lvcreditprincipleamount
        - lvdebitprincipleamount
        - lvcreditgaincash
        - lvdebitgaincash
        - lvcreditgainsettlement
        - lvdebitgainsettlement
        - lvcreditinterestamount
        - lvdebitinterestamount
        - lvcreditmischargeamount
        - lvdebitmischargeamount
        - lvcreditotherchargeamount
        - lvdebitotherchargeamount
        - lvcreditb1amount
        - lvdebitb1amount
        - lvcreditadjustpp
        - lvdebitadjustpp
      formula: SUM
