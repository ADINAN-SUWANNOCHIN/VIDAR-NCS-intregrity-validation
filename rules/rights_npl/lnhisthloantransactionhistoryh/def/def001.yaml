# ============================================================
# def001 — Interest Pivot Integrity Check
# Scope: rights_npl / lnhisthloantransactionhistoryh
#
# Validates that the 3 special interest columns from conv$vinplsbthistory
# were correctly pivoted into ln$lnhisthloantransactionhistoryh.
#
# Business rules:
#   1. interestpaid  → must appear in BOTH creditinterestamount AND debitinterestamount
#      (H is a double-entry ledger: each normal transaction = 1 credit row + 1 debit row)
#   2. interest33    ≈ sbttotalamount ± 0.01 → both go to totaltax
#      (interest33 = interestpaid × 3.3% WHT; validated against totaltax in H)
#   3. interestb4t   → must equal interestb4t in H exactly
#      (running interest balance before this transaction — direct 1:1)
#
# Known edge cases:
#   - ADJ-* sysrefs are excluded from this rule (source_filter in common.yaml).
#     They are validated separately in lnhisthloantransactionhistoryh_adj/def/def001.yaml
#   - interest33 vs sbttotalamount differ by ≤ 0.01 due to rounding.
#     tolerance: 0.01 in defaults handles this.
# ============================================================

def_id: def001
target_scope: transaction_group

actions:
  # REMOVED Step 1 (interestpaid → creditinterestamount) and Step 2 (interestpaid → debitinterestamount):
  # Root cause: 100% of SBT sysrefs overlap with vinplhistory (confirmed via DB query).
  # For sysrefs with multiple vinplhistory IN/C rows, H gets extra credit/debit rows →
  # SUM(H.creditinterestamount) ≠ SBT.interestpaid → guaranteed false mismatch.
  # Double-entry self-balance (step 5) still catches unbalanced rows without false positives.

  # -------------------------------------------------------
  # Step 3: interest33 ≈ totaltax in H
  # interest33 = interestpaid × 3.3% (withholding tax)
  # sbttotalamount = sbtrevenue + sbtrevenueamount (SBT breakdown)
  # Both converge to totaltax with ≤ 0.01 rounding difference
  # -------------------------------------------------------
  - step: "3"
    check_type: ROW_LEVEL_COHESION
    variables:
      val_interest33: "SUM(old.interest33)"
      val_totaltax: "SUM(new.totaltax)"
    condition: "val_interest33 == val_totaltax"
    error_message: >
      interest33 does not match totaltax in H (beyond 0.01 tolerance).
      old.interest33={val_interest33}, new.totaltax={val_totaltax}.
      Possible SBT/WHT tax calculation error during migration.

  # -------------------------------------------------------
  # Step 4: interestb4t → interestb4t (direct balance check)
  # Running interest balance before this transaction — must be identical
  # -------------------------------------------------------
  - step: "4"
    check_type: ROW_LEVEL_COHESION
    variables:
      val_old_ib4t: "SUM(old.interestb4t)"
      val_new_ib4t: "SUM(new.interestb4t)"
    condition: "val_old_ib4t == val_new_ib4t"
    error_message: >
      interestb4t balance mismatch.
      old.interestb4t={val_old_ib4t}, new.interestb4t={val_new_ib4t}.
      Running interest balance was not correctly carried over during migration.

  # -------------------------------------------------------
  # Step 5: Double-entry self-balance check
  # For every normal transaction group, credit and debit interest must be equal
  # (balanced ledger check — purely on new H table)
  # -------------------------------------------------------
  - step: "5"
    check_type: ROW_LEVEL_COHESION
    variables:
      val_credit: "SUM(new.creditinterestamount)"
      val_debit: "SUM(new.debitinterestamount)"
    condition: "val_credit == val_debit"
    error_message: >
      H table interest ledger is unbalanced for this group.
      SUM(creditinterestamount)={val_credit} != SUM(debitinterestamount)={val_debit}.
      Unbalanced double-entry indicates missing or duplicate H row.

  # -------------------------------------------------------
  # Step 6: SBT tax self-check
  # sbttotalamount must equal sbtrevenue + sbtrevenueamount (old side only)
  # Catches calculation errors before migration even introduced them
  # -------------------------------------------------------
  - step: "6"
    check_type: ROW_LEVEL_COHESION
    variables:
      val_sbttotal:  "SUM(old.sbttotalamount)"
      val_sbtrev:    "SUM(old.sbtrevenue)"
      val_sbtrevamt: "SUM(old.sbtrevenueamount)"
    condition: "val_sbttotal == val_sbtrev + val_sbtrevamt"
    error_message: >
      SBT tax inconsistency in source data.
      old.sbttotalamount={val_sbttotal} != old.sbtrevenue({val_sbtrev}) + old.sbtrevenueamount({val_sbtrevamt}).
      Possible SBT tax calculation error in the source system.

  # -------------------------------------------------------
  # Step 7: PP/C → creditprincipleamount
  # Source: conv$vinplhistory (has affectcode + debitcredit columns)
  # SUM of transactionamount where affectcode=PP AND debitcredit=C
  # must equal SUM(new.creditprincipleamount)
  # -------------------------------------------------------
  - step: "7"
    check_type: ROW_LEVEL_COHESION
    trigger_condition:
      must_have_any: [PP]
    variables:
      val_pp_credit: "SUM(old.transactionamount[affectcode=PP][debitcredit=C])"
      val_credit_principle: "SUM(new.creditprincipleamount)"
    condition: "val_pp_credit == val_credit_principle"
    error_message: >
      PP/C not correctly pivoted to creditprincipleamount.
      old.transactionamount[PP/C]={val_pp_credit}, new.creditprincipleamount={val_credit_principle}.

  # -------------------------------------------------------
  # Step 8: QQ/C → transactionamount
  # Source: conv$vinplhistory (has affectcode + debitcredit columns)
  # SUM of transactionamount where affectcode=QQ AND debitcredit=C
  # must equal SUM(new.transactionamount)
  # -------------------------------------------------------
  - step: "8"
    check_type: ROW_LEVEL_COHESION
    trigger_condition:
      must_have_any: [QQ]
    variables:
      val_qq_credit: "SUM(old.transactionamount[affectcode=QQ][debitcredit=C])"
      val_tx_amount: "SUM(new.transactionamount)"
    condition: "val_qq_credit == val_tx_amount"
    error_message: >
      QQ/C not correctly pivoted to transactionamount.
      old.transactionamount[QQ/C]={val_qq_credit}, new.transactionamount={val_tx_amount}.
