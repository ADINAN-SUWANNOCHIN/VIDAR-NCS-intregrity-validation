# ============================================================
# rights_npl / lnhistloantransactionhistory
# TRANSACTION: conv$vinplhistory → ln$lnhistloantransactionhistory
#
# Verified against:
#   - 4COMMON4.xlsx (mapping report)
#   - 1000-row CSV samples (correct_data/4/)
#   - Live DB queries on 172.18.1.153
# ============================================================

table_info:
  source: "[ncs-conv-aging].dbo.[conv$vinplhistory]"
  target: "[ncs-npl-aging].dbo.[ln$lnhistloantransactionhistory]"
  table_type: TRANSACTION
  # BF (804K rows), CAL_INT (200K), B_DIFF (110K) are system batch entries shared across all
  # accounts — grouping by sysref mixes all accounts → VALUE_MISMATCH flood. Skipped for now.
  # Validate separately via row count check if needed.
  source_filter: "systemreferencenumber NOT IN ('BF', 'CAL_INT', 'B_DIFF')"

anchor_key:
  old: id
  new: id

transaction_grouping:
  keys:
    old: systemreferencenumber
    new: systemreferenceno
  target_fetch_key: journalseqno  # indexed; verified equal to systemreferenceno on all rows
  use_sysref_sort: true         # rows are SCATTERED (BF sysref id_range/cnt ratio ≈2282×)
  row_fingerprint:                # post-mismatch row diff — identifies which transaction is missing
    - old: transactiondate
      new: transactiondate
    - old: transactionamount
      new: transactionamount
                                  # anchor-key streaming would compare partial groups → false errors
                                  # note: BF/CAL_INT/B_DIFF still excluded via source_filter above
                                  #       (safe to remove once group-pagination confirmed stable)

defaults:
  tolerance: 0.01

schema_mappings:

  exact_matches:

    # --- ACCOUNT ---
    - old: newaccountno
      new: accountno
    # PLACEHOLDER: accountno (old) → no match in new
    #   old.accountno is the old-format account string (e.g. '0155001966700')
    #   new.accountno = migrated numeric ID → different value, skip

    # --- TRANSACTION CODES ---
    - old: loantransactioncode
      new: loantranshostcode
    # PLACEHOLDER: loantransactionhistorycode (new-only, always empty in sample — no old source)

    - old: auxilarytransaction
      new: auxilarytranscode

    - old: affectcode
      new: affectcode

    - old: debitcredit
      new: debitcredit

    - old: chargetypecode
      new: expensecode
    # PLACEHOLDER: docnoexpense (old) → MISSING in new (expenseseqno always 0 in new)
    #   Old has 89,188 non-zero rows. Confirmed not migrated → FLAG AS MISSING

    # --- TRANSACTION REFERENCE ---
    - old: systemreferencenumber
      new: systemreferenceno
    # PLACEHOLDER: orgsystemreferencenumber (old) → EMPTY in old, skip

    # --- RECEIPT ---
    # Verified: 1,864,287 non-empty rows on both sides — exact match
    - old: receiptnumber
      new: receiptno

    # --- PEOPLE / BRANCH ---
    - old: tellerid
      new: tellerid

    - old: servicebranch
      new: servicebranch

    - old: inputsourcesystem
      new: channel

    # --- FLAGS ---
    - old: lgo1flagb4law
      new: lgo1flagb4law

    - old: lgo1flag
      new: lgo1flag

    - old: lgo2flag
      new: lgo2flag

    # Use pre-converted bit column (_affectnextpaymentflag), not raw affectnextpaymentdate (nvarchar N/Y)
    # Verified: False = False
    - old: _affectnextpaymentflag
      new: affectnextpaymentflag
    # PLACEHOLDER: affectnextpaymentdate (old) → raw N/Y source of _affectnextpaymentflag, skip

    # --- DOCUMENT ---
    - old: doctype
      new: doctype

    - old: billno
      new: billno

    - old: tempid
      new: tempid

    - old: runningno
      new: runningno

    - old: fixfloat
      new: fixfloat

    - old: remark
      new: remark

    - old: receivetxnid
      new: receivetxnid

    # --- RATE ---
    - old: ratevariancecode
      new: variancecode

    # --- MIGRATION TRACKING (all always=1 in old, not business data) ---
    # PLACEHOLDER: success (old bit) → active (new bit) — always 1, migration flag, skip
    # PLACEHOLDER: successlv2 (old bit) → no match — always 1, migration flag, skip
    # PLACEHOLDER: usagebylv2 (old bit) → updateby (new nvarchar) — different semantics, skip
    # PLACEHOLDER: conversionstatus (old nvarchar) → always '1', migration flag, skip

    # --- STAGING / ETL COLUMNS (not business data) ---
    # PLACEHOLDER: line (old bigint) → internal migration sequence, skip
    # PLACEHOLDER: content (old nvarchar) → raw pipe-delimited concat of all fields, skip
    # PLACEHOLDER: _effectivedate (old datetime2) → ETL staging col, skip
    # PLACEHOLDER: _transactiondate (old datetime2) → ETL staging col, skip
    # PLACEHOLDER: keydate (old nvarchar) → ETL staging col, skip
    # PLACEHOLDER: _keydate (old datetime2) → ETL staging col, skip

    # --- NEW-SYSTEM COLUMNS (no old source, populated post-migration) ---
    # PLACEHOLDER: accounttype → new system field
    # PLACEHOLDER: bank → new system field
    # PLACEHOLDER: branch → new system field
    # PLACEHOLDER: accountbranch → new system field
    # PLACEHOLDER: reversal → new system field
    # PLACEHOLDER: transactonseq → new system field
    # PLACEHOLDER: orderno → new system field
    # PLACEHOLDER: journalseqno → new system field
    # PLACEHOLDER: originaljournalseqno → new system field
    # PLACEHOLDER: reversaljournalseqno → new system field
    # PLACEHOLDER: currency → new system field
    # PLACEHOLDER: gleventcode → new system field
    # PLACEHOLDER: glgroupcode → new system field
    # PLACEHOLDER: costcenter → new system field
    # PLACEHOLDER: nextpaymentduedateb4t → new computed field
    # PLACEHOLDER: paymentamountb4t → new computed field
    # PLACEHOLDER: partialamountb4t → new computed field
    # PLACEHOLDER: paymentcodeb4t → new computed field
    # PLACEHOLDER: suspensetaxb4t → new computed field
    # PLACEHOLDER: suspensenontaxb4t → new computed field
    # PLACEHOLDER: deferedinteresttaxb4t → new computed field
    # PLACEHOLDER: deferedinterestnontaxb4t → new computed field
    # PLACEHOLDER: interestb4restb4t → new computed field
    # PLACEHOLDER: miscchargeb4t → new computed field
    # PLACEHOLDER: otherchargeb4t → new computed field
    # PLACEHOLDER: createby → new audit field
    # PLACEHOLDER: updateby → new audit field
    # PLACEHOLDER: updatedate → new audit field
    # PLACEHOLDER: chargeamountid → new system field
    # PLACEHOLDER: billingduedate → new system field
    # PLACEHOLDER: microflowname → new system field
    # PLACEHOLDER: programname → new system field
    # PLACEHOLDER: fromdate → new system field
    # PLACEHOLDER: todate → new system field
    # PLACEHOLDER: principalbalance → new computed field
    # PLACEHOLDER: documentno → new system field
    # PLACEHOLDER: billprinciple → new computed field
    # PLACEHOLDER: billinterest → new computed field
    # PLACEHOLDER: billdefered → new computed field
    # PLACEHOLDER: billinterestb4rest → new computed field
    # PLACEHOLDER: billmiscd → new computed field
    # PLACEHOLDER: billothercharge → new computed field
    # PLACEHOLDER: billpenalty → new computed field
    # PLACEHOLDER: transactionamountdec → new decimal copy of transactionamount
    # PLACEHOLDER: rateno → EMPTY in new (0 non-empty rows confirmed), skip
    # PLACEHOLDER: workflowpaymenttype → new system field
    # PLACEHOLDER: createddate → new audit field
    # PLACEHOLDER: changeddate → new audit field
    # PLACEHOLDER: submetaobjectname → new system field
    # PLACEHOLDER: system$owner → new system field
    # PLACEHOLDER: system$changedby → new system field
    # PLACEHOLDER: assetno → new system field
    # PLACEHOLDER: approvaluserid → new system field
    # PLACEHOLDER: glmmyyyy → new system field
    # PLACEHOLDER: minimumrate → new system field
    # PLACEHOLDER: maximumrate → new system field
    # PLACEHOLDER: ratedescription → new system field
    # PLACEHOLDER: originaltransactionamount → new system field
    # PLACEHOLDER: ratiopayment → new system field (old conversionstatus='1' ≠ new ratiopayment=0.0)
    # PLACEHOLDER: originalpaymentamount → new system field
    # PLACEHOLDER: latechargebillno → new system field
    # PLACEHOLDER: adjustmentflag → new system field
    # PLACEHOLDER: lastcalintdateb4 → new system field

    # !! MIGRATION GAP — REQUIRES BUSINESS REVIEW !!
    # EXCLUDED: repayviatdr — DO NOT ADD TO MAPPINGS
    #   OLD: nvarchar  'N'=11,622,784 | 'Y'=3,029,456 | ''=1,315,358 rows
    #   NEW: bit       false=15,967,598 rows (100%) — confirmed on live DB
    #   REASON: Intentional architectural change.
    #     Old system stored TDR repayment status as a denormalized per-transaction flag.
    #     New system tracks TDR at the account level via ln$tdrportion / ln$tdrportionline.
    #     The repayviatdr bit column in ln$lnhistloantransactionhistory is vestigial (always 0).
    #     TDR data validation belongs in a separate ln$tdrportion coverage check — not here.
    #   WARNING: Adding to mappings would flood the report with 3M+ group-level errors.

    # PLACEHOLDER: severity (old) → EMPTY in old (confirmed), skip
    # PLACEHOLDER: createdate (old datetime2) → EMPTY in old (always NULL confirmed), skip

  transformed_matches:
    # Amount columns: old = nvarchar, new = decimal
    - old: transactionamount
      new: transactionamount
      transform_rule: NONE

    - old: paymentamount
      new: paymentamount
      transform_rule: NONE

    - old: currentbalanceb4t
      new: currentbalanceb4t
      transform_rule: NONE

    - old: interestb4t
      new: interestb4t
      transform_rule: NONE

    - old: penaltyamountb4t
      new: penaltyamountb4t
      transform_rule: NONE

    - old: installment
      new: installmentamount
      transform_rule: NONE

    # Date columns: old = ISO string "2024-01-01T00:00:00.000+07:00", new = datetime2
    - old: transactiondate
      new: transactiondate
      transform_rule: DATE_TO_DATETIME

    - old: effectivedate
      new: effectivedate
      transform_rule: DATE_TO_DATETIME

    - old: interestpaymentduedateb4t
      new: interestpaymentduedateb4t
      transform_rule: DATE_TO_DATETIME

    - old: gldate
      new: gldate
      transform_rule: DATE_TO_DATETIME

    - old: startinterestdate
      new: startinterestdate
      transform_rule: DATE_TO_DATETIME

    - old: endinterestdate
      new: endinterestdate
      transform_rule: DATE_TO_DATETIME

    # createdate: old is always NULL (ETL didn't populate it).
    # New createdate = conversion timestamp set by migration process.
    # Not a strict data check — just document that it exists in new.
    # PLACEHOLDER: createdate → included for awareness, not validated
    #   old createdate (datetime2) = always NULL
    #   new createdate (datetime2) = migration timestamp (e.g. 2023-12-31 17:03:00)

    # Interest rate: old = ".0525" (nvarchar, leading dot), new = decimal 0.0525
    - old: interestrate
      new: interestrate
      transform_rule: STRIP_LEADING_ZEROS

    # Rate variance amount: old = ".0001" (nvarchar), new = decimal
    # Confirmed has data: 579,695 non-zero rows in new
    - old: ratevariance
      new: varianceamount
      transform_rule: STRIP_LEADING_ZEROS

    # Calculate interest rate: old = ".0525" (nvarchar), new = decimal
    - old: calculaterate
      new: calculateintrate
      transform_rule: STRIP_LEADING_ZEROS

  # ---------------------------------------------------------------
  # concat_matches: string identity columns validated in group mode
  #
  # In use_group_pagination mode, exact_matches for string columns are
  # silently skipped (sumColumn returns null for non-numeric values).
  # concat_matches collects the distinct value set per group, sorts and
  # joins with '|', then compares old vs new — catching wrong/missing values.
  # These columns are the primary identifiers that distinguish rows within
  # a group; if they diverge the migration routed rows to the wrong account.
  # ---------------------------------------------------------------
  concat_matches:
    - old_cols: [newaccountno]
      new: accountno

    - old_cols: [affectcode]
      new: affectcode

    - old_cols: [debitcredit]
      new: debitcredit
