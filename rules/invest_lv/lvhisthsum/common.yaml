# ============================================================
# invest_lv / Case 2: TRANSACTION
# conv$vinpllvhistory → lv$lvhisthsum
#
# Row cardinality: 18M old rows vs 11.7M new rows.
# lv$lvhisthsum is a UNION of multiple sources (P-prefix from vinpllvhistory accounts
# for ~24.5%, CE/RQ from vinpllvcithistory for ~57%, and other sources ~18%).
# This rule validates ONLY the vinpllvhistory contribution (P-prefix sysrefs).
# Row count mismatch is expected — other sources inflate the new table row count.
#
# Group key: systemreferenceno (P6xxx / ADC-xxx format, unique per transaction group)
#
# ANCHOR KEY NOTE:
#   IDs are NOT preserved through migration (old id ≠ new id).
#   TransactionStrategy fetches new rows by tg.keys.new (group key).
#   anchor_key.old = id (unique+monotonic auto-increment, keyset pagination cursor only).
#   anchor_key.new = id (required schema field, unused for fetching in group mode).
#
# Excluded from mapping:
#   id — REGENERATED_ID, not preserved.
#   newaccountno — NULL in many rows; accountno already maps to lvaccountno.
#   ceirrate — PROBABLE → irrrate, but irrrate already directly mapped; skip to avoid conflict.
#   _effectivedate, _transactiondate, _keydate — migration-internal temp columns (prefixed _).
#   penaltyamountb4t — not confirmed in new table schema for this source.
#   createdate, severity — NULL_COL (not migrated).
#   conversionstatus — migration operational flag.
#   line, content, success, successlv2 — conv metadata columns.
#   loantranshostcode — schema matched → lvformatgainsettlement (name mismatch; unclear mapping).
#   docnoexpense — MANUAL_CHECK → b4txotherexpense; awaiting business confirmation.
#   runningno — MANUAL_CHECK → runningtxtaxcostbalance; awaiting business confirmation.
#   keydate — internal migration timestamp.
#   tempid — migration-generated temp ID (TEMP-XXXXXXXXXX format).
#
# NULL_COL (confirmed 0 across entire 11.7M row table — 2026-03-17):
#   principledebit, principlecredit, yielddebit, yieldcredit, irrdebit, irrcredit,
#   interestdebit, interestcredit, gainsettlementdebit, gainsettlementcredit,
#   otherchargedebit, otherchargecredit, penaltyamountdebit, penaltyamountcredit,
#   creditaccrueinterest, txcreditinterest, txdebitinterest,
#   txcreditmiscellaneousexpense, txdebitmiscellaneousexpense
#
# TX_PENDING (populated but transformation formula not yet confirmed — 2026-03-17):
#   txcredittaxcostbalance, txdebittaxcostbalance, txcreditgaintaxbalance,
#   txdebitgaintaxbalance, txcreditotherexpense, txdebitotherexpense,
#   txcreditintascitratio, txdebitintascitratio
#   → See rules/global/lvhisthsum_mapping.yaml § tx_columns_pending for totals and notes.
# ============================================================

table_info:
  source: "[ncs-conv-aging].dbo.[conv$vinpllvhistory]"
  target: "[ncs-npl-aging].dbo.[lv$lvhisthsum]"
  table_type: TRANSACTION
  # P-prefix and ADC-prefix: accountno value = lvaccountno value (direct, no cithistory translation).
  # All other batch prefixes (CE, RQ, TD, IN, REV, AE, TMB, IR) use cithistory translation
  # and are validated by the separate lvhisthsum_cerq rule.
  # Z-prefix and BF have sysref count explosion between old and new — pending investigation.
  source_filter: "systemreferenceno LIKE 'P%' OR systemreferenceno LIKE 'ADC%'"

anchor_key:
  old: id
  new: id

transaction_grouping:
  keys:
    old: systemreferenceno
    new: systemreferenceno
  target_fetch_key: journalseqno  # indexed; verified equal to systemreferenceno on all rows
  use_sysref_sort: true         # rows are SCATTERED (100% of groups, avg ratio 5M×)
                                  # source_filter filters on group key column → compatible with group pagination

defaults:
  tolerance: 0.01

# affectcode is always NULL in lv$lvhisthsum (new table) — querySumByGroup returns empty map
# → every old affectcode would show SUM mismatch (9 false positives). Skip aggregate check.
skip_aggregate_sum_check: true

schema_mappings:

  exact_matches:
    - old: accountno
      new: lvaccountno

    - old: affectcode
      new: affectcode

    - old: chargetype
      new: chargetype

    - old: tellerid
      new: tellerid

    - old: inputsourcesystem
      new: inputsourcesystem

    - old: orgsystemreferencenumber
      new: orgsystemreferencenumber

    - old: doctype
      new: doctype

    - old: auxilarytransaction
      new: auxilarytranscode          # renamed (shortened)

    - old: debitcredit
      new: debitcredit___             # renamed with suffix in new system

    - old: noofdays
      new: noofdays

    - old: remark
      new: remark

  transformed_matches:
    # Amount columns: old = nvarchar, new = decimal
    - old: transactionamount
      new: transactionamount
      transform_rule: NONE

    - old: paymentamount
      new: paymentamount
      transform_rule: NONE

    - old: gaincashbalanceb4t
      new: gaincashbalanceb4t
      transform_rule: NONE

    - old: gainsettlementbalanceb4t
      new: gainsettlementbalanceb4t
      transform_rule: NONE

    # currentbalanceb4t — excluded: post-migration recalculation, old ≠ new by design.
    # old carries a different starting balance than new (confirmed on live DB: 3524462.16 ≠ 3662346.34).
    # - old: currentbalanceb4t
    #   new: currentbalanceb4t
    #   transform_rule: NONE

    - old: interestb4t
      new: interestb4t
      transform_rule: NONE

    - old: calprovisionamount
      new: calprovisionamount
      transform_rule: NONE

    # Rate columns: old = ".0235" (leading dot, nvarchar), new = decimal
    - old: yieldrate
      new: yieldrate
      transform_rule: STRIP_LEADING_ZEROS

    - old: irrrate
      new: irrrate
      transform_rule: STRIP_LEADING_ZEROS

    - old: calculateintrate
      new: calculateintrate
      transform_rule: STRIP_LEADING_ZEROS

    # Date columns: old = ISO string "2024-01-01T00:00:00.000+07:00", new = datetime2
    - old: transactiondate
      new: transactiondate
      transform_rule: DATE_TO_DATETIME

    - old: effectivedate
      new: effectivedate
      transform_rule: DATE_TO_DATETIME

    - old: gldate
      new: gldate
      transform_rule: DATE_TO_DATETIME

    - old: startinterestdate
      new: startinterestdate
      transform_rule: DATE_TO_DATETIME

    - old: endinterestdate
      new: endinterestdate
      transform_rule: DATE_TO_DATETIME

  # ---------------------------------------------------------------
  # filtered_sum_matches: lvcredit*/lvdebit* columns
  #
  # Each new lv* column = SUM(old.transactionamount) for rows where:
  #   - affectcode matches the specified group
  #   - debitcredit matches C or D
  #   - loantranshostcode NOT IN the consolidate=N exclusion list
  #     (derived from transactioncode.json newlinehistconsolidate='N'
  #      + unknown codes not in transactioncode.json)
  #
  # Reference: rules/global/lvhisthsum_mapping.yaml
  # Verified on: P6303-005209, P6102-009721, P6401-909712
  # ---------------------------------------------------------------
  filtered_sum_matches:

    # PRINCIPAL (เงินต้น)
    - old: transactionamount
      old_filter:
        affectcode_in: [PP]
        debitcredit: C
        loantranshostcode_not_in: ["80000","81000","82100","90000","92090","99000","21300","21400","29300","29400","24100","25100","24200","25200","26100","26200"]
      new: lvcreditprincipleamount

    - old: transactionamount
      old_filter:
        affectcode_in: [PP]
        debitcredit: D
        loantranshostcode_not_in: ["80000","81000","82100","90000","92090","99000","21300","21400","29300","29400","24100","25100","24200","25200","26100","26200"]
      new: lvdebitprincipleamount

    # INTEREST (ดอกเบี้ย — all interest-family codes map to the same pair)
    # I1=ดอกเบี้ย, I2=ดอกเบี้ยพัก, I3=ดอกเบี้ยก่อนปรับปรุง,
    # IN=ดอกเบี้ยไม่รับรู้, IT=ดอกเบี้ยรับรู้, GG=ดอกเบี้ยผิดนัด
    - old: transactionamount
      old_filter:
        affectcode_in: [I1, I2, I3, IN, IT, GG]
        debitcredit: C
        loantranshostcode_not_in: ["80000","81000","82100","90000","92090","99000","21300","21400","29300","29400","24100","25100","24200","25200","26100","26200"]
      new: lvcreditinterestamount

    - old: transactionamount
      old_filter:
        affectcode_in: [I1, I2, I3, IN, IT, GG]
        debitcredit: D
        loantranshostcode_not_in: ["80000","81000","82100","90000","92090","99000","21300","21400","29300","29400","24100","25100","24200","25200","26100","26200"]
      new: lvdebitinterestamount

    # GAIN CASH (ส่วนเกินทุน)
    - old: transactionamount
      old_filter:
        affectcode_in: [GC]
        debitcredit: C
        loantranshostcode_not_in: ["80000","81000","82100","90000","92090","99000","21300","21400","29300","29400","24100","25100","24200","25200","26100","26200"]
      new: lvcreditgaincash

    - old: transactionamount
      old_filter:
        affectcode_in: [GC]
        debitcredit: D
        loantranshostcode_not_in: ["80000","81000","82100","90000","92090","99000","21300","21400","29300","29400","24100","25100","24200","25200","26100","26200"]
      new: lvdebitgaincash

    # GAIN SETTLEMENT (ขายทอดตลาดชำระหนี้)
    - old: transactionamount
      old_filter:
        affectcode_in: [GS]
        debitcredit: C
        loantranshostcode_not_in: ["80000","81000","82100","90000","92090","99000","21300","21400","29300","29400","24100","25100","24200","25200","26100","26200"]
      new: lvcreditgainsettlement

    - old: transactionamount
      old_filter:
        affectcode_in: [GS]
        debitcredit: D
        loantranshostcode_not_in: ["80000","81000","82100","90000","92090","99000","21300","21400","29300","29400","24100","25100","24200","25200","26100","26200"]
      new: lvdebitgainsettlement

    # OTHER CHARGE (OF=Other Charge Fee, CF=Client Charge — both map to same column)
    - old: transactionamount
      old_filter:
        affectcode_in: [OF, CF]
        debitcredit: C
        loantranshostcode_not_in: ["80000","81000","82100","90000","92090","99000","21300","21400","29300","29400","24100","25100","24200","25200","26100","26200"]
      new: lvcreditotherchargeamount

    - old: transactionamount
      old_filter:
        affectcode_in: [OF, CF]
        debitcredit: D
        loantranshostcode_not_in: ["80000","81000","82100","90000","92090","99000","21300","21400","29300","29400","24100","25100","24200","25200","26100","26200"]
      new: lvdebitotherchargeamount

    # YIELD (ผลตอบแทน) — I2 rows redirected from lvcreditinterestamount via excluded lthc codes
    # Confirmed: P5911-005454 I2/24100/C=22828.02 → lvcredityieldamount=22828.02 ✓
    #            ADC6304-0086 I2/26100/C=105774.47 → lvcredityieldamount=105774.47 ✓
    - old: transactionamount
      old_filter:
        affectcode_in: [I2]
        debitcredit: C
        loantranshostcode_in: ["24100", "26100"]
      new: lvcredityieldamount

    - old: transactionamount
      old_filter:
        affectcode_in: [I2]
        debitcredit: D
        loantranshostcode_in: ["25100"]
      new: lvdebityieldamount

    # IRR (อัตราดอกเบี้ยภายใน) — I3 rows redirected via excluded lthc codes
    # Confirmed: ADC6104-0810 I3/26200/C=31937021120.55 → lvcreditirramount ✓
    #            24200 inferred by symmetry (not yet DB-verified)
    - old: transactionamount
      old_filter:
        affectcode_in: [I3]
        debitcredit: C
        loantranshostcode_in: ["24200", "26200"]
      new: lvcreditirramount

    - old: transactionamount
      old_filter:
        affectcode_in: [I3]
        debitcredit: D
        loantranshostcode_in: ["25200"]
      new: lvdebitirramount

    # MISC CHARGE — always 0 across entire table (no data), included for completeness
    # lvdebitmischargeamount also always 0 (MF/D — same evidence as credit side)
    # - old: transactionamount
    #   old_filter:
    #     affectcode_in: [MF]
    #     debitcredit: C
    #     loantranshostcode_not_in: [...]
    #   new: lvcreditmischargeamount

  # ---------------------------------------------------------------
  # lvformat* columns — NOT mapped here (derived, validated implicitly)
  #
  # lvformatprincipleamount    = lvdebitprincipleamount    - lvcreditprincipleamount
  # lvformatinterestamount     = lvdebitinterestamount     - lvcreditinterestamount
  # lvformatgaincash           = lvdebitgaincash           - lvcreditgaincash
  # lvformatgainsettlement     = lvdebitgainsettlement     - lvcreditgainsettlement
  # lvformatotherchargeamount  = lvdebitotherchargeamount  - lvcreditotherchargeamount
  # lvformattotalgain          = lvformatgaincash          + lvformatgainsettlement
  #
  # Both operands live in the new table — formula_matches operates on OLD source columns
  # so these cannot be expressed as mappings. Since filtered_sum_matches above validate
  # each lvdebit*/lvcredit* individually, correctness of lvformat* follows automatically.
  # ---------------------------------------------------------------
