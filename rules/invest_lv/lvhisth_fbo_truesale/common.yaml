# ============================================================
# invest_lv / Case 5: TRANSACTION (filtered source)
# conv$vinpllvcithistory → lv$lvhisth_fbo_truesale
#
# Source filter: invaccounttype IN ('TF','TS') (FBO + TrueSale combined)
# Row count: 2,061 old rows → 2,061 new rows (1,159 TF + 902 TS).
# Group key: systemreferenceno
# ============================================================

table_info:
  source: "[ncs-conv-aging].dbo.[conv$vinpllvcithistory]"
  target: "[ncs-npl-aging].dbo.[lv$lvhisth_fbo_truesale]"
  table_type: TRANSACTION
  source_filter: "invaccounttype IN ('TF','TS')"

anchor_key:
  old: id
  new: id

transaction_grouping:
  keys:
    old: systemreferenceno
    new: systemreferenceno

defaults:
  tolerance: 0.01

schema_mappings:

  exact_matches:
    - old: invaccountno
      new: lvaccountno

    - old: invaccounttype
      new: lvaccounttype

    - old: auxilarytransactioncode
      new: auxilarytranscode

    - old: orderno
      new: orderno

    - old: tellerid
      new: tellerid

    - old: glgroupcode
      new: glgroupcode

    - old: costcenter
      new: costcenter

    - old: inputsourcesystem
      new: inputsourcesystem

    - old: reversalflag
      new: reversal

    - old: remark
      new: remark

    - old: sendtax
      new: sendtax

    - old: txdiffcostexpenseamount
      new: txdiffcostexpenseamount

    - old: txformatbalancewriteoff
      new: txformatbalancewriteoff

    - old: currency
      new: currency

    - old: doctype
      new: doctype

    - old: citratio
      new: citratio

    - old: orgjournalseqno
      new: journalseqno

    - old: eventcode
      new: gleventcode

    - old: otherchargeamountb4t
      new: otherchargeamountb4t

  transformed_matches:
    - old: transactionamount
      new: transactionamount
      transform_rule: NONE

    - old: principleamount
      new: lvdebitprincipleamount
      transform_rule: NONE

    - old: interestamount
      new: lvdebitinterestamount
      transform_rule: NONE

    - old: otherchargeamount
      new: lvcreditotherchargeamount
      transform_rule: NONE

    - old: paymentamount
      new: paymentamount
      transform_rule: NONE

    - old: currentbalanceb4t
      new: currentbalanceb4t
      transform_rule: NONE

    - old: investtaxoutstandingbalance
      new: b4txtaxcostbalance
      transform_rule: NONE

    - old: transactiondate
      new: transactiondate
      transform_rule: DATE_TO_DATETIME

    - old: effectivedate
      new: effectivedate
      transform_rule: DATE_TO_DATETIME

    - old: gldate
      new: gldate
      transform_rule: DATE_TO_DATETIME
