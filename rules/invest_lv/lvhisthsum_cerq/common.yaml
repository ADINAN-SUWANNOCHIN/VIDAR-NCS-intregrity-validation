# ============================================================
# invest_lv / Case 7: TRANSACTION (composite group key)
# conv$vinpllvhistory → lv$lvhisthsum
#
# This rule validates all batch/composite-key sysrefs:
# CE, RQ, TD, IN, REV, AE, TMB, IR, TW, DVD, GHB, SAL, YIELD-END,
# Z#P, ZER, BF, and bank portfolio prefixes (SCB, UOB, TTB, BAY, KTB,
# KBAN, TBAN, CIMB, LHB, SCIB, SCBT, TCRB, SMC, BT, EXIM, ICBC, AAI).
# These sysrefs cover multiple accounts per sysref, so the group
# key is a COMPOSITE of (systemreferenceno, accountno).
#
# Account ID translation:
#   old accountno → new lvaccountno via cithistory
#   SELECT newinvaccountno FROM conv$vinpllvcithistory WHERE invaccountno = @accountno
#   Mapping is per-account (no sysref filter needed). 1:1 verified (0 inconsistencies).
#
# Data verified:
#   CE6302-000001: 44,554 accounts → 100% pass (fully_matched=44554, mismatch=0)
#   RQ long format (RQ17-120-013257): cithistory row exists by sysref — works same as CE
#   RQ short format (RQ11-113-000001): cithistory row found by invaccountno-only lookup ✓
#   Affectcodes: CE = I1/D (dominant), PP/D, GS/D, GC/D, OF/D(rare)
#                RQ = OF/D only
#
# Group key: (systemreferenceno, accountno) → (systemreferenceno, lvaccountno)
#   1 old group = N vinpllvhistory rows for one (sysref, account) pair
#   1 new row per (sysref, account) in lvhisthsum (aggregated lv* columns)
#
# ANCHOR KEY NOTE:
#   IDs are NOT preserved through migration (old id ≠ new id).
#   anchor_key.old = id (keyset pagination cursor for source streaming).
#   anchor_key.new = id (required schema field, unused for fetching in group mode).
#
# Excluded from mapping (same as P-rule):
#   id — REGENERATED_ID, not preserved.
#   accountno — handled by composite_key translation (not a direct exact_match).
#   newaccountno — NULL in many rows.
#   ceirrate — irrrate already directly mapped; skip to avoid conflict.
#   _effectivedate, _transactiondate, _keydate — migration-internal temp columns.
#   penaltyamountb4t — not confirmed in new table schema.
#   createdate, severity — NULL_COL (not migrated).
#   conversionstatus — migration operational flag.
#   line, content, success, successlv2 — conv metadata columns.
#   loantranshostcode — not a column in lvhisthsum.
#   docnoexpense — MANUAL_CHECK; awaiting business confirmation.
#   runningno — MANUAL_CHECK; awaiting business confirmation.
#   keydate — internal migration timestamp.
#   tempid — migration-generated temp ID.
# ============================================================

table_info:
  source: "[ncs-conv-aging].dbo.[conv$vinpllvhistory]"
  target: "[ncs-npl-aging].dbo.[lv$lvhisthsum]"
  table_type: TRANSACTION
  # Batch/composite-key sysrefs — each (sysref, accountno) maps to one new row via cithistory.
  #
  # --- Confirmed batch (multiple accounts per sysref) ---
  # CE%       — 201 sysrefs,  avg 19,431 accts, cithistory ~99% ✓ (100% pass on 44,554 accts)
  # TD%       — 2,291 sysrefs, avg 528 accts,   cithistory ~99% ✓
  # IN%       — 2,046 sysrefs, avg 489 accts,   cithistory ~98% ✓
  # REV%      — 2,574 sysrefs, avg 79 accts,    cithistory 100% ✓
  # AE%       — 7,689 sysrefs, avg 9.3 accts,   cithistory 100% ✓
  # TMB%      — 28 sysrefs,    avg 318 accts,   cithistory 100% ✓
  # TW-%      — 315 sysrefs,   avg 399 accts,   in old ✓
  # DVD-%     — 864 sysrefs,   avg 156 accts,   in old ✓
  # GHB%      — 9 sysrefs,     avg 4,501 accts, in old ✓ (Government Housing Bank portfolios)
  # SAL%      — 17 sysrefs,    avg 575 accts,   in old ✓ (note: ~35% row reduction, ask business)
  # YIELD-END — 1 sysref,      25,096 accts,    in old ✓
  # Z#P%      — 8 sysrefs,     avg 25,672 accts, cithistory ✓ (closed account batch)
  # ZER%      — 632 sysrefs,   avg 464 accts,   cithistory ✓ (zero/written-off accounts)
  # BF%       — 2 main sysrefs, avg 48K accts,  cithistory ~97.5% (BF=Balance Brought Forward)
  #             ~2.4% unmapped accounts are pre-migration legacy (acceptable ROW_MISSING noise)
  #
  # --- Confirmed sysref-level but needs cithistory (mostly 1:1) ---
  # RQ%       — 812K sysrefs, avg 1.00 accts,   cithistory via lookup ✓
  # IR%       — 366K sysrefs, avg 1.02 accts,   cithistory 100% ✓
  #
  # --- Bank portfolio acquisitions (composite-key) ---
  # SCB%, UOB%, TTB%, BAY%, KTB%, KBAN%, TBAN%, CIMB%, LHB%, SCIB%, SCBT%
  # TCRB%, SMC%, BT%, EXIM%, ICBC%, AAI-%
  #   All are NPL portfolios transferred from other Thai banks. Composite-key via cithistory.
  #
  # --- Excluded (NOT from vinpllvhistory) ---
  #   ZLS%  — 0 rows in old table, comes from different source (all-zero amounts in new)
  #
  # --- Sysref-level, confirmed CITHISTORY (avg 1 acct/sysref) ---
  # APEG%  — 140,570 sysrefs, cithistory ✓
  # APE%   — 35,693 sysrefs (subset of APE, excl APEG already covered), cithistory ✓
  # ABS-%  — 34,744 sysrefs, cithistory ✓
  # OTE%   — 32,522 sysrefs, cithistory ✓
  # AGP%   — 8,744 sysrefs,  cithistory ✓
  # RP%    — 6,588 sysrefs,  cithistory ✓
  # B%     — 36,494 sysrefs, cithistory ✓ (B_BEGIN_AMC and similar)
  # ADJ%   — 1,107+ sysrefs, cithistory ✓ (covers ADJ, ADJUST, ADJY, ADJE, ADJI, etc.)
  #
  # NOT included (0 rows in old table — come from different source):
  #   BTAX, ATAX, JV, RAM
  source_filter: >-
    systemreferenceno LIKE 'CE%'
    OR systemreferenceno LIKE 'RQ%'
    OR systemreferenceno LIKE 'TD%'
    OR systemreferenceno LIKE 'IN%'
    OR systemreferenceno LIKE 'REV%'
    OR systemreferenceno LIKE 'AE%'
    OR systemreferenceno LIKE 'TMB%'
    OR systemreferenceno LIKE 'IR%'
    OR systemreferenceno LIKE 'TW-%'
    OR systemreferenceno LIKE 'DVD-%'
    OR systemreferenceno LIKE 'GHB%'
    OR systemreferenceno LIKE 'SAL%'
    OR systemreferenceno = 'YIELD-END'
    OR systemreferenceno LIKE 'Z#P%'
    OR systemreferenceno LIKE 'ZER%'
    OR systemreferenceno LIKE 'BF%'
    OR systemreferenceno LIKE 'SCB%'
    OR systemreferenceno LIKE 'UOB%'
    OR systemreferenceno LIKE 'TTB%'
    OR systemreferenceno LIKE 'BAY%'
    OR systemreferenceno LIKE 'KTB%'
    OR systemreferenceno LIKE 'KBAN%'
    OR systemreferenceno LIKE 'TBAN%'
    OR systemreferenceno LIKE 'CIMB%'
    OR systemreferenceno LIKE 'LHB%'
    OR systemreferenceno LIKE 'SCIB%'
    OR systemreferenceno LIKE 'SCBT%'
    OR systemreferenceno LIKE 'TCRB%'
    OR systemreferenceno LIKE 'SMC%'
    OR systemreferenceno LIKE 'BT%'
    OR systemreferenceno LIKE 'EXIM%'
    OR systemreferenceno LIKE 'ICBC%'
    OR systemreferenceno LIKE 'AAI-%'
    OR systemreferenceno LIKE 'APE%'
    OR systemreferenceno LIKE 'ABS-%'
    OR systemreferenceno LIKE 'OTE%'
    OR systemreferenceno LIKE 'AGP%'
    OR systemreferenceno LIKE 'RP%'
    OR systemreferenceno LIKE 'B%'
    OR systemreferenceno LIKE 'ADJ%'

anchor_key:
  old: id
  new: id

transaction_grouping:
  keys:
    old: systemreferenceno
    new: systemreferenceno
  composite_key:
    old_col: accountno
    new_col: lvaccountno
    account_mapping:
      table: "[ncs-conv-aging].dbo.[conv$vinpllvcithistory]"
      lookup_col: invaccountno
      result_col: newinvaccountno

defaults:
  tolerance: 0.01

schema_mappings:

  exact_matches:
    # NOTE: accountno → lvaccountno is NOT listed here.
    # The composite_key config handles account pairing via cithistory translation.

    - old: affectcode
      new: affectcode

    - old: chargetype
      new: chargetype

    - old: tellerid
      new: tellerid

    - old: inputsourcesystem
      new: inputsourcesystem

    - old: orgsystemreferencenumber
      new: orgsystemreferencenumber

    - old: doctype
      new: doctype

    - old: auxilarytransaction
      new: auxilarytranscode          # renamed (shortened)

    - old: debitcredit
      new: debitcredit___             # renamed with suffix in new system

    - old: noofdays
      new: noofdays

    - old: remark
      new: remark

  transformed_matches:
    # Amount columns: old = nvarchar, new = decimal
    - old: transactionamount
      new: transactionamount
      transform_rule: NONE

    - old: paymentamount
      new: paymentamount
      transform_rule: NONE

    - old: gaincashbalanceb4t
      new: gaincashbalanceb4t
      transform_rule: NONE

    - old: gainsettlementbalanceb4t
      new: gainsettlementbalanceb4t
      transform_rule: NONE

    # currentbalanceb4t — excluded: post-migration recalculation, old ≠ new by design.
    # - old: currentbalanceb4t
    #   new: currentbalanceb4t
    #   transform_rule: NONE

    - old: interestb4t
      new: interestb4t
      transform_rule: NONE

    - old: calprovisionamount
      new: calprovisionamount
      transform_rule: NONE

    # Rate columns: old = ".0235" (leading dot, nvarchar), new = decimal
    - old: yieldrate
      new: yieldrate
      transform_rule: STRIP_LEADING_ZEROS

    - old: irrrate
      new: irrrate
      transform_rule: STRIP_LEADING_ZEROS

    - old: calculateintrate
      new: calculateintrate
      transform_rule: STRIP_LEADING_ZEROS

    # Date columns: old = ISO string "2024-01-01T00:00:00.000+07:00", new = datetime2
    - old: transactiondate
      new: transactiondate
      transform_rule: DATE_TO_DATETIME

    - old: effectivedate
      new: effectivedate
      transform_rule: DATE_TO_DATETIME

    - old: gldate
      new: gldate
      transform_rule: DATE_TO_DATETIME

    - old: startinterestdate
      new: startinterestdate
      transform_rule: DATE_TO_DATETIME

    - old: endinterestdate
      new: endinterestdate
      transform_rule: DATE_TO_DATETIME

  # ---------------------------------------------------------------
  # filtered_sum_matches: lvcredit*/lvdebit* columns
  #
  # Identical formula to P-rule. Within each (sysref, accountno) composite
  # key group, SUM(transactionamount) filtered by affectcode + debitcredit
  # + loantranshostcode exclusion list = new lv* column.
  #
  # Reference: rules/global/lvhisthsum_mapping.yaml
  # Verified on: CE6302-000001 (44,554 accounts, 100% pass)
  #              RQ11-113-000001 (lvdebitotherchargeamount=2500 ✓)
  # ---------------------------------------------------------------
  filtered_sum_matches:

    # PRINCIPAL (เงินต้น)
    - old: transactionamount
      old_filter:
        affectcode_in: [PP]
        debitcredit: C
        loantranshostcode_not_in: ["80000","81000","82100","90000","92090","99000","21300","21400","29300","29400","24100","25100","24200","25200","26100","26200"]
      new: lvcreditprincipleamount

    - old: transactionamount
      old_filter:
        affectcode_in: [PP]
        debitcredit: D
        loantranshostcode_not_in: ["80000","81000","82100","90000","92090","99000","21300","21400","29300","29400","24100","25100","24200","25200","26100","26200"]
      new: lvdebitprincipleamount

    # INTEREST (ดอกเบี้ย)
    - old: transactionamount
      old_filter:
        affectcode_in: [I1, I2, I3, IN, IT, GG]
        debitcredit: C
        loantranshostcode_not_in: ["80000","81000","82100","90000","92090","99000","21300","21400","29300","29400","24100","25100","24200","25200","26100","26200"]
      new: lvcreditinterestamount

    - old: transactionamount
      old_filter:
        affectcode_in: [I1, I2, I3, IN, IT, GG]
        debitcredit: D
        loantranshostcode_not_in: ["80000","81000","82100","90000","92090","99000","21300","21400","29300","29400","24100","25100","24200","25200","26100","26200"]
      new: lvdebitinterestamount

    # GAIN CASH (ส่วนเกินทุน)
    - old: transactionamount
      old_filter:
        affectcode_in: [GC]
        debitcredit: C
        loantranshostcode_not_in: ["80000","81000","82100","90000","92090","99000","21300","21400","29300","29400","24100","25100","24200","25200","26100","26200"]
      new: lvcreditgaincash

    - old: transactionamount
      old_filter:
        affectcode_in: [GC]
        debitcredit: D
        loantranshostcode_not_in: ["80000","81000","82100","90000","92090","99000","21300","21400","29300","29400","24100","25100","24200","25200","26100","26200"]
      new: lvdebitgaincash

    # GAIN SETTLEMENT (ขายทอดตลาดชำระหนี้)
    - old: transactionamount
      old_filter:
        affectcode_in: [GS]
        debitcredit: C
        loantranshostcode_not_in: ["80000","81000","82100","90000","92090","99000","21300","21400","29300","29400","24100","25100","24200","25200","26100","26200"]
      new: lvcreditgainsettlement

    - old: transactionamount
      old_filter:
        affectcode_in: [GS]
        debitcredit: D
        loantranshostcode_not_in: ["80000","81000","82100","90000","92090","99000","21300","21400","29300","29400","24100","25100","24200","25200","26100","26200"]
      new: lvdebitgainsettlement

    # OTHER CHARGE (OF=Other Charge Fee, CF=Client Charge)
    - old: transactionamount
      old_filter:
        affectcode_in: [OF, CF]
        debitcredit: C
        loantranshostcode_not_in: ["80000","81000","82100","90000","92090","99000","21300","21400","29300","29400","24100","25100","24200","25200","26100","26200"]
      new: lvcreditotherchargeamount

    - old: transactionamount
      old_filter:
        affectcode_in: [OF, CF]
        debitcredit: D
        loantranshostcode_not_in: ["80000","81000","82100","90000","92090","99000","21300","21400","29300","29400","24100","25100","24200","25200","26100","26200"]
      new: lvdebitotherchargeamount

    # YIELD (ผลตอบแทน) — I2 rows redirected via excluded lthc codes
    # Confirmed: ADC6304-0086 I2/26100/C=105774.47 → lvcredityieldamount ✓
    # BUG FIX 2026-03-17: removed 26200 (I3/C → lvcreditirramount, not yield)
    #                     removed I3 from affectcode_in for same reason
    - old: transactionamount
      old_filter:
        affectcode_in: [I2]
        debitcredit: C
        loantranshostcode_in: ["24100", "26100"]
      new: lvcredityieldamount

    - old: transactionamount
      old_filter:
        affectcode_in: [I2]
        debitcredit: D
        loantranshostcode_in: ["25100"]
      new: lvdebityieldamount

    # IRR (อัตราดอกเบี้ยภายใน) — I3 rows redirected via excluded lthc codes
    # Confirmed: ADC6104-0810 I3/26200/C=31937021120.55 → lvcreditirramount ✓
    # BUG FIX 2026-03-17: added 26200 to lvcreditirramount (was incorrectly in lvcredityieldamount)
    - old: transactionamount
      old_filter:
        affectcode_in: [I3]
        debitcredit: C
        loantranshostcode_in: ["24200", "26200"]
      new: lvcreditirramount

    - old: transactionamount
      old_filter:
        affectcode_in: [I3]
        debitcredit: D
        loantranshostcode_in: ["25200"]
      new: lvdebitirramount

  # ---------------------------------------------------------------
  # lvformat* columns — NOT mapped here (derived, validated implicitly)
  #
  # lvformatprincipleamount    = lvdebitprincipleamount    - lvcreditprincipleamount
  # lvformatinterestamount     = lvdebitinterestamount     - lvcreditinterestamount
  # lvformatgaincash           = lvdebitgaincash           - lvcreditgaincash
  # lvformatgainsettlement     = lvdebitgainsettlement     - lvcreditgainsettlement
  # lvformatotherchargeamount  = lvdebitotherchargeamount  - lvcreditotherchargeamount
  # lvformattotalgain          = lvformatgaincash          + lvformatgainsettlement
  #
  # Both operands live in the new table — formula_matches operates on OLD source columns
  # so these cannot be expressed as mappings. Since filtered_sum_matches above validate
  # each lvdebit*/lvcredit* individually, correctness of lvformat* follows automatically.
  # ---------------------------------------------------------------
