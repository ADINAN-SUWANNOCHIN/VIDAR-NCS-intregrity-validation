# ============================================================
# invest_lv / Case 7: TRANSACTION (composite group key)
# conv$vinpllvhistory → lv$lvhisthsum
#
# This rule validates CE/RQ batch sysrefs only.
# These sysrefs cover multiple accounts per sysref, so the group
# key is a COMPOSITE of (systemreferenceno, accountno).
#
# Account ID translation:
#   old accountno → new lvaccountno via cithistory
#   SELECT newinvaccountno FROM conv$vinpllvcithistory WHERE invaccountno = @accountno
#   Mapping is per-account (no sysref filter needed). 1:1 verified (0 inconsistencies).
#
# Data verified:
#   CE6302-000001: 44,554 accounts → 100% pass (fully_matched=44554, mismatch=0)
#   RQ long format (RQ17-120-013257): cithistory row exists by sysref — works same as CE
#   RQ short format (RQ11-113-000001): cithistory row found by invaccountno-only lookup ✓
#   Affectcodes: CE = I1/D (dominant), PP/D, GS/D, GC/D, OF/D(rare)
#                RQ = OF/D only
#
# Group key: (systemreferenceno, accountno) → (systemreferenceno, lvaccountno)
#   1 old group = N vinpllvhistory rows for one (sysref, account) pair
#   1 new row per (sysref, account) in lvhisthsum (aggregated lv* columns)
#
# ANCHOR KEY NOTE:
#   IDs are NOT preserved through migration (old id ≠ new id).
#   anchor_key.old = id (keyset pagination cursor for source streaming).
#   anchor_key.new = id (required schema field, unused for fetching in group mode).
#
# Excluded from mapping (same as P-rule):
#   id — REGENERATED_ID, not preserved.
#   accountno — handled by composite_key translation (not a direct exact_match).
#   newaccountno — NULL in many rows.
#   ceirrate — irrrate already directly mapped; skip to avoid conflict.
#   _effectivedate, _transactiondate, _keydate — migration-internal temp columns.
#   penaltyamountb4t — not confirmed in new table schema.
#   createdate, severity — NULL_COL (not migrated).
#   conversionstatus — migration operational flag.
#   line, content, success, successlv2 — conv metadata columns.
#   loantranshostcode — not a column in lvhisthsum.
#   docnoexpense — MANUAL_CHECK; awaiting business confirmation.
#   runningno — MANUAL_CHECK; awaiting business confirmation.
#   keydate — internal migration timestamp.
#   tempid — migration-generated temp ID.
# ============================================================

table_info:
  source: "[ncs-conv-aging].dbo.[conv$vinpllvhistory]"
  target: "[ncs-npl-aging].dbo.[lv$lvhisthsum]"
  table_type: TRANSACTION
  # CE% and RQ% sysrefs are batch transactions with multiple accounts per sysref.
  # Each (sysref, accountno) pair maps to one new row via cithistory account translation.
  source_filter: "systemreferenceno LIKE 'CE%' OR systemreferenceno LIKE 'RQ%'"

anchor_key:
  old: id
  new: id

transaction_grouping:
  keys:
    old: systemreferenceno
    new: systemreferenceno
  composite_key:
    old_col: accountno
    new_col: lvaccountno
    account_mapping:
      table: "[ncs-conv-aging].dbo.[conv$vinpllvcithistory]"
      lookup_col: invaccountno
      result_col: newinvaccountno

defaults:
  tolerance: 0.01

schema_mappings:

  exact_matches:
    # NOTE: accountno → lvaccountno is NOT listed here.
    # The composite_key config handles account pairing via cithistory translation.

    - old: affectcode
      new: affectcode

    - old: chargetype
      new: chargetype

    - old: tellerid
      new: tellerid

    - old: inputsourcesystem
      new: inputsourcesystem

    - old: orgsystemreferencenumber
      new: orgsystemreferencenumber

    - old: doctype
      new: doctype

    - old: auxilarytransaction
      new: auxilarytranscode          # renamed (shortened)

    - old: debitcredit
      new: debitcredit___             # renamed with suffix in new system

    - old: noofdays
      new: noofdays

    - old: remark
      new: remark

  transformed_matches:
    # Amount columns: old = nvarchar, new = decimal
    - old: transactionamount
      new: transactionamount
      transform_rule: NONE

    - old: paymentamount
      new: paymentamount
      transform_rule: NONE

    - old: gaincashbalanceb4t
      new: gaincashbalanceb4t
      transform_rule: NONE

    - old: gainsettlementbalanceb4t
      new: gainsettlementbalanceb4t
      transform_rule: NONE

    # currentbalanceb4t — excluded: post-migration recalculation, old ≠ new by design.
    # - old: currentbalanceb4t
    #   new: currentbalanceb4t
    #   transform_rule: NONE

    - old: interestb4t
      new: interestb4t
      transform_rule: NONE

    - old: calprovisionamount
      new: calprovisionamount
      transform_rule: NONE

    # Rate columns: old = ".0235" (leading dot, nvarchar), new = decimal
    - old: yieldrate
      new: yieldrate
      transform_rule: STRIP_LEADING_ZEROS

    - old: irrrate
      new: irrrate
      transform_rule: STRIP_LEADING_ZEROS

    - old: calculateintrate
      new: calculateintrate
      transform_rule: STRIP_LEADING_ZEROS

    # Date columns: old = ISO string "2024-01-01T00:00:00.000+07:00", new = datetime2
    - old: transactiondate
      new: transactiondate
      transform_rule: DATE_TO_DATETIME

    - old: effectivedate
      new: effectivedate
      transform_rule: DATE_TO_DATETIME

    - old: gldate
      new: gldate
      transform_rule: DATE_TO_DATETIME

    - old: startinterestdate
      new: startinterestdate
      transform_rule: DATE_TO_DATETIME

    - old: endinterestdate
      new: endinterestdate
      transform_rule: DATE_TO_DATETIME

  # ---------------------------------------------------------------
  # filtered_sum_matches: lvcredit*/lvdebit* columns
  #
  # Identical formula to P-rule. Within each (sysref, accountno) composite
  # key group, SUM(transactionamount) filtered by affectcode + debitcredit
  # + loantranshostcode exclusion list = new lv* column.
  #
  # Reference: rules/global/lvhisthsum_mapping.yaml
  # Verified on: CE6302-000001 (44,554 accounts, 100% pass)
  #              RQ11-113-000001 (lvdebitotherchargeamount=2500 ✓)
  # ---------------------------------------------------------------
  filtered_sum_matches:

    # PRINCIPAL (เงินต้น)
    - old: transactionamount
      old_filter:
        affectcode_in: [PP]
        debitcredit: C
        loantranshostcode_not_in: ["80000","81000","82100","90000","92090","99000","21300","21400","29300","29400","24100","25100","24200","25200","26100","26200"]
      new: lvcreditprincipleamount

    - old: transactionamount
      old_filter:
        affectcode_in: [PP]
        debitcredit: D
        loantranshostcode_not_in: ["80000","81000","82100","90000","92090","99000","21300","21400","29300","29400","24100","25100","24200","25200","26100","26200"]
      new: lvdebitprincipleamount

    # INTEREST (ดอกเบี้ย)
    - old: transactionamount
      old_filter:
        affectcode_in: [I1, I2, I3, IN, IT, GG]
        debitcredit: C
        loantranshostcode_not_in: ["80000","81000","82100","90000","92090","99000","21300","21400","29300","29400","24100","25100","24200","25200","26100","26200"]
      new: lvcreditinterestamount

    - old: transactionamount
      old_filter:
        affectcode_in: [I1, I2, I3, IN, IT, GG]
        debitcredit: D
        loantranshostcode_not_in: ["80000","81000","82100","90000","92090","99000","21300","21400","29300","29400","24100","25100","24200","25200","26100","26200"]
      new: lvdebitinterestamount

    # GAIN CASH (ส่วนเกินทุน)
    - old: transactionamount
      old_filter:
        affectcode_in: [GC]
        debitcredit: C
        loantranshostcode_not_in: ["80000","81000","82100","90000","92090","99000","21300","21400","29300","29400","24100","25100","24200","25200","26100","26200"]
      new: lvcreditgaincash

    - old: transactionamount
      old_filter:
        affectcode_in: [GC]
        debitcredit: D
        loantranshostcode_not_in: ["80000","81000","82100","90000","92090","99000","21300","21400","29300","29400","24100","25100","24200","25200","26100","26200"]
      new: lvdebitgaincash

    # GAIN SETTLEMENT (ขายทอดตลาดชำระหนี้)
    - old: transactionamount
      old_filter:
        affectcode_in: [GS]
        debitcredit: C
        loantranshostcode_not_in: ["80000","81000","82100","90000","92090","99000","21300","21400","29300","29400","24100","25100","24200","25200","26100","26200"]
      new: lvcreditgainsettlement

    - old: transactionamount
      old_filter:
        affectcode_in: [GS]
        debitcredit: D
        loantranshostcode_not_in: ["80000","81000","82100","90000","92090","99000","21300","21400","29300","29400","24100","25100","24200","25200","26100","26200"]
      new: lvdebitgainsettlement

    # OTHER CHARGE (OF=Other Charge Fee, CF=Client Charge)
    - old: transactionamount
      old_filter:
        affectcode_in: [OF, CF]
        debitcredit: C
        loantranshostcode_not_in: ["80000","81000","82100","90000","92090","99000","21300","21400","29300","29400","24100","25100","24200","25200","26100","26200"]
      new: lvcreditotherchargeamount

    - old: transactionamount
      old_filter:
        affectcode_in: [OF, CF]
        debitcredit: D
        loantranshostcode_not_in: ["80000","81000","82100","90000","92090","99000","21300","21400","29300","29400","24100","25100","24200","25200","26100","26200"]
      new: lvdebitotherchargeamount

  # ---------------------------------------------------------------
  # lvformat* columns — NOT mapped here (derived, validated implicitly)
  #
  # lvformatprincipleamount    = lvdebitprincipleamount    - lvcreditprincipleamount
  # lvformatinterestamount     = lvdebitinterestamount     - lvcreditinterestamount
  # lvformatgaincash           = lvdebitgaincash           - lvcreditgaincash
  # lvformatgainsettlement     = lvdebitgainsettlement     - lvcreditgainsettlement
  # lvformatotherchargeamount  = lvdebitotherchargeamount  - lvcreditotherchargeamount
  # lvformattotalgain          = lvformatgaincash          + lvformatgainsettlement
  #
  # Both operands live in the new table — formula_matches operates on OLD source columns
  # so these cannot be expressed as mappings. Since filtered_sum_matches above validate
  # each lvdebit*/lvcredit* individually, correctness of lvformat* follows automatically.
  # ---------------------------------------------------------------
