# ============================================================
# DEF-001: Teller ID conversion check
# (Table-specific override of global/defs/def001.yaml)
#
# Business rule:
#   The new system should look up each teller code from the old system
#   and store the corresponding user NAME in la$lahistloantransactionhistory.tellerid.
#
#   If the lookup succeeds → tellerid = full name (e.g. "สมชาย สุขใจ")
#   If the lookup fails   → tellerid = "*CONV" or "*[original_code]" (asterisk prefix)
#
# What should be flagged (fail_if_new_matches):
#   1. ^\d+$      — still a pure numeric code (e.g. "2398") → not converted
#   2. ^\*        — starts with asterisk (e.g. "*CONV", "*2398") → explicit ETL failure
#   3. ^CONV$     — plain "CONV" (without asterisk) → not converted
#
# What is allowed (skip_if_old_equals):
#   - old.tellerid = "CONV" → this was already a conversion record in the old system;
#     one corresponding "CONV" in new is permitted per such old row.
#
# Error output format:
#   "Teller ID not converted — old tellerid: [2398] → new tellerid: [2398]"
#   Group key is also recorded in the Detail_Log CSV.
# ============================================================

def_id: def001
target_scope: transaction_group

actions:
  - step: "1"
    check_type: FIELD_VALUE_CHECK
    variables:
      new_col: tellerid
      old_col: tellerid
      skip_if_old_equals: CONV
      fail_if_new_matches: "^\\d+$|^\\*|^CONV$"
    condition: valid
    error_message: "Teller ID not converted — new system still stores original code or *CONV marker"
